# 数据来源和许可登记表（PPT 第三部分“数据资源：从哪来、能不能商用”）。
# 规矩：每加一个数据源，先在这里登记，再使用。
# python -m syntherisk.cli load-precedents 和 load-catalog 只接受这里登记过、并且 allowed = true 的来源。

[source.uspto]
name = "USPTO 专利反应（Lowe，1976–2016，约 177 万条）"
used_for = "文献先例、条件、产率（M5）"
license = "CC0"
commercial_use = "可以；需要清洗"
allowed = true
notes = "产率是从专利文本自动提取的，只有约四成反应有产率，以原文为准。"

[source.ord]
name = "Open Reaction Database"
used_for = "文献先例（M5）"
license = "CC BY-SA"
commercial_use = "可以，要求相同方式共享；和自有数据混合前先做法律确认"
allowed = true

[source.pubchem_ghs]
name = "PubChem GHS 分类"
used_for = "毒性和危害（M6）"
license = "公开数据"
commercial_use = "可以，展示时注明来源"
allowed = true

[source.controlled_ca_us]
name = "加拿大、美国管制清单"
used_for = "管制提示（M6）"
license = "政府公开信息"
commercial_use = "可以，有机器可读版本"
allowed = true
notes = "data/controlled_substances.csv 目前是手工整理的初稿（reviewed = 0），要对照官方清单复核。"

[source.controlled_cn_tw]
name = "中国大陆、台湾管制清单"
used_for = "管制提示（M6）"
license = "政府公开信息"
commercial_use = "可以；需手工整理、定期复查"
allowed = true
notes = "大陆清单是手工整理的初稿；台湾清单还没有整理。"

[source.zinc]
name = "ZINC 在售目录"
used_for = "原料能不能买到（M4）"
license = "见 ZINC 使用条款"
commercial_use = "内部可用；正式商用前邮件确认"
allowed = true

[source.seed]
name = "内置常用试剂表（data/compounds.csv）"
