# 数据来源和许可登记表（PPT 第三部分“数据资源：从哪来、能不能商用”）。
# 规矩：每加一个数据源，先在这里登记，再使用。
# python -m syntherisk.cli load-precedents 和 load-catalog 只接受这里登记过、并且 allowed = true 的来源。

[source.uspto]
name = "USPTO 专利反应（Lowe，1976–2016，约 177 万条）"
name_en = "USPTO patent reactions (Lowe, 1976–2016, about 1.77 million)"
used_for = "文献先例、条件、产率（M5）"
used_for_en = "Literature precedents, conditions, yields (M5)"
license = "CC0"
commercial_use = "可以；需要清洗"
commercial_use_en = "Yes; needs cleaning"
allowed = true
notes = "产率是从专利文本自动提取的，只有约四成反应有产率，以原文为准。"
notes_en = "Yields are extracted automatically from patent text; only about 40% of reactions have one, and the original text prevails."

[source.ord]
name = "Open Reaction Database"
used_for = "文献先例（M5）"
used_for_en = "Literature precedents (M5)"
license = "CC BY-SA"
commercial_use = "可以，要求相同方式共享；和自有数据混合前先做法律确认"
commercial_use_en = "Yes, share-alike required; get legal confirmation before mixing with proprietary data"
allowed = true

