full_text = '''
## 第一条 协议主体及组成

1.1 本协议由 Syntherisk Technology Inc.（位于加拿大魁北克省，以下简称“公司”）与经公司邀请并依本协议取得测试资格的个人参与者（以下简称“测试方”）订立。双方单独称“一方”，合称“双方”。

1.2 本轮采用个人邀请制。本协议不建立机构客户关系，不因填写单位名称、使用单位邮箱或持有账号而约束测试方所在学校、实验室或企业。机构测试、联合研发及数据处理等专项合作，应另行签署书面协议。

1.3 本协议全文及另行取得有效接受的书面补充协议构成双方的测试约定。拟通过链接纳入的其他合同条款，应在接受前明确提示并提供可阅读、可保存的具体版本；仅在网站其他位置展示不当然使其成为本协议内容。隐私说明及依法另行取得的个人信息同意，应按各自的适用规则处理，不因接受本协议而被概括授权。

## 第二条 电子订约及授权

2.1 公司向获邀且具备相应订约能力的测试方提供本协议项下的有限测试权限。公司应在提交接受前提供完整、清晰且可保存的协议文本，并履行适用的语言程序。测试方主动勾选接受选项并点击“同意协议并进入内测”，其接受意思表示经系统到达公司时，在法律规定及本协议要求的成立、生效条件均满足的前提下，本协议成立并生效。仅浏览、滚动、关闭弹窗或未作答，不构成接受。需监护人或其他法定代理人参与的，按第 2.2 款办理。

2.2 上述自行接受流程仅适用于已达到适用法律规定的成年年龄且具备相应订约能力的测试方。其他申请人应由具备相应权限的监护人或法定代理人联系 admin@syntherisk.com。公司应核实必要的身份及代理权限，依法完成相应代理订约或同意程序，并提供可保存的开通确认。对于该等申请人，本协议于前述订约或同意程序完成且开通确认送达时成立并生效；此前不得参加测试。未成年人自行作出成年声明或声称已获监护人同意，不替代上述程序。

2.3 合同代理或监护人同意不替代依法需要的个人信息告知及同意；涉及未成年人个人信息的，公司应在相关处理前完成适用的特别保护程序。个人信息同意资格与合同订约资格应分别判断，不适用统一的年龄推定。监护人不因提出申请、代理订约或作出同意而自动承担保证责任或放弃未成年人的法定权利。

2.4 公司应保留足以关联测试方、接受时间、实际选项、协议版本及对应全文的记录，并提供可保存的接受确认和文本副本。依法另行取得个人信息同意时，还应记录具体目的、告知版本、同意状态及后续撤回。记录应保持完整，必要更正应保留原记录及依据；不得以新版覆盖旧版接受内容。记录范围及保存期限应符合必要性和适用法律，不作永久保留。该安排独立于产品审计功能；“不提供审计功能”不免除依法或依约应履行的留存义务。

## 第三条 测试许可及使用范围

3.1 本轮测试免费，自依法有效接受并获开通之日起开始，至测试方退出、测试资格终止或本轮测试结束时止。公司授予测试方有限、非独占、不可转让、不可分许可的使用许可，仅供本人评估公司已开放的功能并开展非商业性研究评估，不得作为生产服务或向第三方提供收费服务。

3.2 本轮不要求上传文件，但允许在开放的功能中输入分子结构、SMILES 或其他文本。输入范围限于测试方依法有权提供的公开、非敏感材料；存在输入框不构成接收未公开研究或受限制资料的授权。公司可按资源情况设置合理的测试限额并在使用前提示。本轮免费不构成未来服务免费的承诺；收费或自动续费须另行明确约定并取得有效接受。

3.3 测试方不得出借、转售、共享账号或访问凭证；不得未经授权开放第三方访问、规避权限或调用限制、访问其他用户材料、实施破坏性测试，或妨碍服务正常运行。发现账号失控或未经授权访问，应及时通知公司。

3.4 除适用法律不得限制的行为或公司事先书面授权外，测试方不得对产品进行反编译、反汇编、反向工程、模型提取，或获取非公开源代码、模型参数、系统提示及实现方法；不得利用公司的保密信息开发、训练或改进竞争性产品。本条不限制不使用公司保密信息的独立开发、依法不得禁止的研究或法定例外。

## 第四条 测试版本

4.1 本产品为内测版本。公司可基于测试、维护、安全或资源需要调整功能；测试服务可能出现中断、错误、结果偏差或数据丢失。除双方另有明确书面约定外，公司不作持续可用、固定响应时间或满足特定用途的保证。当前版本不提供审计功能。测试方应自行保存其依法或依适用制度需要留存的资料。

4.2 产品输出仅供研究评估。测试方应在采购、实验、合成、放大、发表或其他实际应用前，独立核对原始资料、知识产权状态、适用法规和安全条件，并履行所在机构的审批程序。公司不保证生成路线可实施、实验结果可重复，或输出足以证明安全、合规及不侵权。

4.3 本条对产品能力的界定不免除公司依法或依本协议承担的保密、个人信息保护、事件处理或其他不可排除的责任。

## 第五条 保密信息的定义及例外

5.1 “保密信息”指一方或其授权代表在本次测试中向另一方披露、提供或使其接触的非公开信息，且该信息被标示为保密，或依其性质及披露情形应合理认定为保密。提供信息的一方称“披露方”，接收信息的一方称“接收方”。信息载体及是否加注保密标识，不单独决定其保密性质。

5.2 公司的保密信息包括非公开产品界面、功能、缺陷、性能、测试结果、源代码、技术文档、模型及算法实现、系统配置、商业计划、报价及客户信息，以及足以披露前述信息的截图、录屏、复制件、导出文件和比较报告。

5.3 测试方在获准范围内向公司提供的非公开反馈、支持沟通及其他依法有权披露的信息，符合第 5.1 款条件的，同样属于其保密信息。本轮不要求上传资料，不因此使自愿提供且应合理保密的信息失去保护；但保密保护不等同于公司同意接收第七条禁止提交的材料。

5.4 保密义务不适用于接收方能够以合理证据证明的下列信息：非因其违约而已公开的信息；披露前已合法持有且不负保密义务的信息；从有权披露且不违反保密义务的第三方合法取得的信息；未利用披露方保密信息而独立开发的信息；或披露方书面同意公开的信息。

## 第六条 保密义务及允许披露

6.1 接收方仅可为履行本协议及开展获准测试使用保密信息，并应采取与信息性质及风险相适应、至少达到合理程度的保护措施。未经披露方事先书面同意，不得为自身其他商业目的或任何第三方利益使用、披露、出售或许可使用保密信息。

6.2 接收方仅可向履行上述目的确有必要知悉、已获授权且依法或依约承担充分保密义务的人员披露。接收方应管理其授权人员的接触及使用，并对其依法应负责的行为承担责任。公司使用服务商还应符合第九条及个人信息处理告知。

6.3 未经披露方事先书面许可，不得通过社交媒体、公开或未经批准的群组、代码仓库、论文、课程、会议、客户演示或市场推广披露保密信息；不得将其上传至未经批准的第三方人工智能、翻译或文件处理服务。去除名称或标识，不当然使仍可识别的结构、路线或技术资料失去保密性质。

6.4 依法院命令、法律或有权机关要求必须披露的，接收方应在法律允许且实际可行的范围内事先通知披露方，并将披露限于法定必要范围。向负有职业保密义务且确有必要知悉的法律顾问披露，以及受法律保护的投诉、举报、监管沟通或为公共健康与安全所依法允许的披露，不受本协议不当限制。本款不授权超出适用法律保护范围的公开传播。

6.5 发现保密信息被未经授权访问、使用或披露时，接收方应无不当延迟地通知披露方，并采取合理措施制止侵害、控制影响和配合补救。任何一方均不得因此销毁依法应保存的证据或妨碍法定调查及通知义务。

6.6 未经对方书面同意，任何一方不得将对方名称、商标、标识、参与测试的事实或非公开测试结果用于宣传、背书或案例展示。

## 第七条 用户材料及有限处理授权

7.1 “用户材料”指测试方通过产品输入的分子结构、SMILES、其他文本，以及在获准的反馈或支持渠道内实际提供的内容。本轮不要求上传文件；以键入、粘贴或其他输入方式提供内容，仍属于提供用户材料。测试方不得提交其无权披露的信息，也不得在输入、反馈、邮件或截图中加入本次测试不必要的个人信息。

7.2 本轮不得提交未公开的专利申请前资料、机构或客户机密、第三方个人信息、患者或健康资料、受出口管制或其他特别限制的资料。确需处理此类资料的，应在提交前另行完成书面范围确认、权利核实及适用的保护安排；普通测试邀请不构成该等授权。

7.3 对依法并经允许提交的用户材料，测试方仅授予公司为执行其明确请求、向其提供相关结果、处理其反馈及维护服务安全所必要的非独占、有限处理许可。该许可不转移材料的所有权，不代替个人信息处理的法律依据，亦不授权使用尚未披露的接收方或超出已告知范围的处理。

7.4 本轮不默认授权公司或其服务商将用户材料或可识别个人的使用记录用于模型训练、微调、独立模型评测、评分校准、共享数据集、研究发表、公开案例、营销或转售。公司拟增加此类用途时，须事先另行明确范围、取得必要权利并在依法需要时取得单独有效同意；未取得前不得实施。测试方主动报告故障所必需的排查，不构成对上述额外用途的许可。

## 第八条 知识产权及反馈

8.1 公司及其许可方保留其依法享有的产品、软件、文档、模型、数据库、商标、技术及其改进的知识产权。测试方及相关权利人保留用户材料、既有技术及研究成果中的权利。除明示的有限许可外，本协议不转让或默示授予任何一方的知识产权。

8.2 测试方可以在不侵犯第三方权利并遵守保密义务的前提下，为本人的非商业性研究评估保存和分析输出。将输出或非公开测试结果用于论文发表、公开演示、对外提供服务或商业项目，应事先取得公司的书面许可及其他必要授权。公开可得的原始文献及测试方未使用公司保密信息独立形成的成果，不因本协议自动成为公司财产。

8.3 本协议不保证输出具有独创性、独占性、可专利性或不侵权性；对自动生成内容的权利认定以适用法律为准。测试方对外发表或利用输出时，不得未经授权披露公司或第三方的保密信息。

8.4 测试方自愿提供的不含保密信息、个人信息或第三方受限内容的一般功能建议，公司可免费使用、修改并实施；该许可不转让测试方的专利、研究成果或其他既有知识产权，也不构成公开身份或反馈原文的授权。涉及专利许可、权利转让或联合研发的，双方应另行订立明确的书面协议。

8.5 任何一方不得擅自移除权利标识；未经对方事先书面授权，不得利用对方保密信息为自身或第三方申请与该信息有关的知识产权。法定不能转让的权利，不因本协议被视为已转让；本协议不包含概括性的精神权利放弃。

## 第九条 个人信息及服务商

9.1 公司应遵守适用于相关处理活动的魁北克个人信息保护法律、加拿大联邦法律及其他依法适用的强制性规定。

9.2 不要求上传文件，不等于不发生数据处理。公司应在相关收集前或依法要求的时点，以简短提示和可查阅的完整隐私说明，突出数据类别与收集方式、具体目的、接收方，以及可能实质影响个人的风险或后果，并说明必要性、处理地区、保存安排、个人权利及拒绝提供的影响。通过技术手段收集个人信息时，应依法公布并更新该说明。接受本协议不构成对未告知处理或任意新增用途的授权；依法需要的个人信息同意应按具体目的另行请求，不与合同接受捆绑。

9.3 公司只应处理提供所请求服务、必要沟通、服务安全及证明有效接受所必需的信息，并将接触范围限制于确有履职需要的人员及服务商。公司应在委托处理前落实适当书面安排，约束用途、保密、安全、留存、删除及事件通知，并核实相关服务商是否将资料用于自身目的。公司对其控制的个人信息继续承担适用责任，不因委托处理而当然免除。

9.4 涉及向魁北克以外提供个人信息，或委托魁北克以外的主体代为收集、使用、传递或保存个人信息时，公司应在实施前依法完成隐私影响评估、必要的书面安排、告知及同意程序；法律另有规定的，从其规定。公司有理由认为发生个人信息保密事件时，应依法采取措施、评估风险、记录并履行适用通知义务，不以取得泄露的最终确证为处理前提。

9.5 相关个人可向 ethan.zhang@syntherisk.com 就其本人的个人信息提出访问、更正、依法适用的删除、符合条件的可携带副本、撤回同意或其他权利请求。公司可进行必要且适度的身份核验，并应在适用法定期限内答复；拒绝时应说明适用理由及救济渠道。对基于同意的处理，撤回应按适用法律落实，不影响撤回前依法进行的处理。撤回必要处理同意可能影响相应功能，但不得仅因拒绝与本轮服务无关的额外用途而拒绝必要服务。投诉可提交公司隐私负责人或有管辖权的监管机构。

