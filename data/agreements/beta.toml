8.3 La Société ne garantit pas que les résultats sont originaux, exclusifs, brevetables, enregistrables ou exempts d'atteinte aux droits de tiers; des résultats identiques ou semblables peuvent être fournis à d'autres Participants. L'existence et la titularité des droits sur les contenus générés automatiquement sont déterminées par la loi. La Convention ne crée pas de droits que la loi ne reconnaît pas et ne transfère pas automatiquement à la Société les droits préexistants sur les Contenus utilisateur. Avant toute utilisation externe des résultats, le Participant doit obtenir les autorisations nécessaires et respecter le paragraphe 8.2.

8.4 Pour les suggestions générales de fonctionnalités, descriptions de défauts et propositions d'amélioration fournies volontairement par le Participant, qu'il a le droit de concéder sous licence et qui ne contiennent ni renseignements personnels, ni Renseignements confidentiels, ni contenus de tiers soumis à restrictions, le Participant accorde à la Société une licence mondiale, non exclusive et sans redevances, valable pendant la durée des droits concernés et irrévocable dans la mesure permise par la loi. La Société peut reproduire, modifier, intégrer et mettre en œuvre cette rétroaction afin de développer, améliorer, maintenir et commercialiser ses produits, et en permettre l'utilisation dans ce cadre par des développeurs ou prestataires soumis à des restrictions de finalité et de confidentialité. La licence peut être transférée avec l'activité ou les actifs concernés. L'utilisation de cette rétroaction générale n'impose pas automatiquement de rémunération, de mention de contribution, de partage de revenus ou de participation à une collaboration. La licence ne permet pas de publier l'identité du Participant ou sa rétroaction brute, n'accorde aucune licence de brevet et ne cède aucun résultat de recherche préexistant. Les brevets, développements commandés et autres résultats particuliers nécessitent une entente écrite distincte.

8.5 Le Participant ne doit pas retirer ou modifier sans autorisation les mentions de droit d'auteur, de marque de commerce, de confidentialité ou de provenance de la Société ou de ses concédants, ni se présenter faussement comme auteur, inventeur, titulaire de droits ou représentant autorisé des Technologies de la Société. Sans autorisation écrite, il ne doit pas utiliser les Renseignements confidentiels de la Société ou les technologies sur lesquelles elle détient légalement des droits pour demander, enregistrer, acquérir par cession ou aider à obtenir, pour lui-même ou un tiers, des brevets, enregistrements de droit d'auteur, marques de commerce, noms de domaine ou autres droits connexes. En cas de demande ou d'enregistrement contraire au présent paragraphe, il doit, dans les limites de la loi et de son contrôle, collaborer à l'arrêt, au retrait, à la correction ou au transfert des droits légalement dus à la Société. La titularité est déterminée par la loi et les actes écrits valides, et non par une déclaration unilatérale de la Société.

