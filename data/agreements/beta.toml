full_text = '''
## Article 1 Parties et documents contractuels

1.1 La présente convention (la « Convention ») est conclue entre Syntherisk Technology Inc., située au Québec, Canada (la « Société »), et la personne invitée par la Société qui obtient le droit de participer à l'essai conformément à la Convention (le « Participant »). La Société et le Participant sont désignés individuellement comme une « Partie » et collectivement comme les « Parties ».

1.2 Cet essai est proposé sur invitation à des particuliers. La Convention ne crée aucune relation de clientèle institutionnelle. La mention du nom d'une organisation, l'utilisation de son adresse courriel ou la détention d'un compte ne lie pas l'établissement d'enseignement, le laboratoire ou l'entreprise du Participant. Les essais institutionnels, la recherche et le développement conjoints, le traitement de données et les autres collaborations particulières nécessitent des accords écrits distincts.

1.3 Le texte intégral de la Convention et les accords complémentaires écrits acceptés séparément et valablement constituent l'entente des Parties relative à l'essai. Les autres clauses contractuelles destinées à être incorporées par un lien doivent être expressément signalées avant l'acceptation, et leur version précise doit pouvoir être lue et conservée. Leur simple affichage ailleurs sur le site ne les incorpore pas automatiquement à la Convention. La Politique de confidentialité et les consentements relatifs aux renseignements personnels obtenus séparément lorsque la loi l'exige demeurent soumis à leurs règles respectives; l'acceptation de la Convention ne constitue pas une autorisation générale. La Société doit afficher clairement la version courante de la Convention, sa langue et la version correspondante de la Politique de confidentialité; les différentes versions ne doivent pas être confondues.

## Article 2 Conclusion électronique et autorisations

2.1 La Société fournit un accès limité à l'essai aux Participants invités qui satisfont au paragraphe 2.2. Avant la transmission de l'acceptation, elle doit fournir le texte intégral, clair et conservable de la Convention et la Politique de confidentialité applicable, et suivre les modalités linguistiques du paragraphe 12.4. Lorsque le Participant coche activement les cases d'acceptation de la Convention et de choix de la langue du contrat, puis clique sur « Accepter la Convention et accéder à l'essai », ou sur le bouton équivalent d'une autre version contractuelle, la Convention est formée et prend effet dès que cette manifestation d'acceptation parvient à la Société par le système, sous réserve des conditions légales de formation et de prise d'effet. Les cases ne doivent pas être précochées. Le refus ou la fermeture de la fenêtre ne doit pas activer l'accès. La simple navigation, le défilement, le silence ou la sélection d'une langue d'interface ne constitue pas une acceptation.

