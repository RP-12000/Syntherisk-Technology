## Article 2 Electronic Contracting and Authority

2.1 The Company provides invited Participants who have the requisite contractual capacity with limited beta access under this Agreement. Before acceptance is submitted, the Company must provide the complete, clear and savable text of the Agreement and comply with applicable language procedures. When the Participant actively selects the acceptance option and clicks "Accept Agreement and Enter Beta", this Agreement is formed and takes effect when that expression of acceptance reaches the Company through the system, provided that all requirements for formation and effectiveness under law and this Agreement have been met. Merely browsing, scrolling, closing the popup or failing to respond does not constitute acceptance. Where a guardian or other legal representative must be involved, Clause 2.2 applies.

