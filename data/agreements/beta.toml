## Article 9 Renseignements personnels et prestataires de services

9.1 Avant la collecte concernée ou au moment prescrit par la loi, la Société doit publier une Politique de confidentialité directement accessible, conservable et conforme aux traitements réels, avec des accès permanents dans les invitations, l'interface d'acceptation et le produit. La Convention ne remplace pas cette politique. La Société doit publier sur son site le titre et les coordonnées de la personne responsable de la protection des renseignements personnels. La politique doit préciser les moyens et procédures applicables à l'accès, à la rectification, à la suppression lorsque légalement applicable, au retrait du consentement et aux plaintes; le Participant peut utiliser les canaux ainsi publiés. La politique et les avis de collecte doivent décrire fidèlement les catégories de données saisies et de résultats, renseignements de compte ou d'invitation, preuves d'acceptation, données techniques et autres données réellement traitées; leurs sources, fins, fondements juridiques, destinataires, lieux de traitement, durées précises de conservation ou critères de détermination, mesures de sécurité, moyens d'exercice des droits et conséquences d'un refus; et mettre en évidence les risques pouvant affecter sensiblement les personnes. Les prestataires, lieux de stockage, mesures de non-conservation ou de chiffrement non vérifiés ne doivent pas être présentés comme acquis. Aucun traitement ne doit être activé avant les vérifications, informations et consentements applicables nécessaires.

9.2 Le traitement des renseignements personnels doit se limiter à des fins précises, communiquées et fondées en droit, dans le respect de la nécessité et de la proportionnalité. Les licences de l'article 7 ne remplacent pas le consentement relatif aux renseignements personnels et n'autorisent pas automatiquement le profilage, la publicité, la vente de données ou l'entraînement pour les propres fins de tiers. La Société doit limiter l'accès aux personnes qui en ont réellement besoin pour leurs fonctions. Avant tout traitement confié à un prestataire, elle doit établir des ententes écrites appropriées précisant les finalités, la confidentialité, la sécurité, la sous-traitance, la conservation, la suppression et la notification des incidents, et vérifier les éventuelles utilisations aux propres fins du prestataire. La Société demeure responsable, selon le droit applicable, des renseignements personnels sous son contrôle.

9.3 Lorsque la loi l'exige, la Société doit effectuer une évaluation des facteurs relatifs à la vie privée pour les projets de systèmes d'information ou de services électroniques impliquant des renseignements personnels. Avant leur communication ou leur traitement confié à l'extérieur du Québec, elle doit réaliser les évaluations, ententes écrites, informations et procédures de consentement applicables. Lorsqu'un incident de confidentialité impliquant des renseignements personnels survient ou qu'il existe des motifs raisonnables de le soupçonner, la Société doit rapidement maîtriser les risques, enquêter, préserver les faits nécessaires, évaluer le risque de préjudice, documenter sa réponse et aviser les autorités et personnes concernées selon la loi. L'absence de preuve définitive d'une fuite ou de fonction d'audit du produit ne justifie aucun retard dans les mesures légalement requises.

9.4 Si des témoins de connexion, outils d'analyse ou autres technologies d'identification, de localisation ou de profilage sont effectivement utilisés, la Société doit décrire fidèlement leurs fins, destinataires et contrôles dans la Politique de confidentialité et les interfaces pertinentes, et respecter les exigences applicables d'information préalable, de choix d'activation ou de consentement. Lorsque la loi exige les paramètres de confidentialité les plus protecteurs par défaut, ils doivent être mis en place avant l'activation. Les déclarations publiques relatives à la sécurité, à la conservation et à la suppression doivent correspondre aux configurations réelles. Le présent paragraphe n'affirme pas que cette version utilise un outil particulier ou bénéficie d'une certification de sécurité.

9.5 La Société doit mettre en œuvre le présent article par des procédures réelles : avant l'activation, vérifier les flux de données, les prestataires et les lieux de traitement, puis établir et publier la Politique de confidentialité applicable; instaurer les accès minimaux nécessaires, les règles de conservation et de suppression, le traitement des demandes d'exercice des droits et la réponse aux incidents; conserver les preuves des évaluations et ententes légalement requises. Les durées de conservation doivent correspondre aux catégories de données et aux fins précises; l'« amélioration continue » ne justifie pas une conservation indéfinie. Les traitements supplémentaires non vérifiés doivent rester désactivés. La personne responsable doit réexaminer périodiquement la concordance entre la politique et les configurations réelles.

## Article 10 Durée et résiliation de la Convention et sort des documents

10.1 La Convention s'applique dès sa formation et sa prise d'effet conformément à l'article 2, jusqu'au retrait du Participant, à la cessation légale de son admissibilité par la Société ou à la fin de cet essai. Les dispositions relatives à la titularité des droits de propriété intellectuelle, aux licences de rétroaction, à la confidentialité, à la responsabilité et aux différends qui doivent, par leur nature, subsister continuent de s'appliquer.

10.2 Le Participant peut se retirer à tout moment par les canaux de soutien à l'essai ou de contact publiés sur le site de la Société, sans motif ni frais de retrait. Si la Société a des motifs raisonnables de croire à une inadmissibilité, une violation de confidentialité, une extraction de modèle, une atteinte à la propriété intellectuelle, une utilisation illégale ou un autre risque important, elle peut imposer des restrictions d'accès, une suspension ou une résiliation nécessaires et proportionnées, en précisant les raisons et moyens de contact lorsque la loi et les circonstances le permettent. Elle peut agir d'urgence pour préserver des preuves ou faire cesser une atteinte continue, sans déterminer unilatéralement et définitivement la responsabilité. Pour une fin d'essai ou une annulation globale du service sans urgence, elle donne en principe un préavis d'au moins sept jours civils et offre la possibilité de conserver les contenus autorisés dans la mesure effectivement disponible.

10.3 À la fin de la Convention, le Participant doit cesser d'accéder au produit et d'utiliser les identifiants, mettre fin aux utilisations de résultats dépassant la durée ou la portée de la licence, et supprimer ou restituer les Renseignements confidentiels de la Société, copies et contenus dérivés qu'il n'est plus autorisé à détenir. Sur demande raisonnable, il doit confirmer les mesures prises dans les limites de son contrôle. Les conventions, confirmations d'acceptation et preuves dont la conservation est légalement requise ou réellement nécessaire à la protection de droits précis peuvent être conservées de manière restreinte, sous les obligations de confidentialité existantes. La Société doit disposer des Contenus utilisateur et renseignements personnels selon les délais légaux et communiqués. Les sauvegardes suivent les modalités de suppression correspondantes; après restauration, les exigences applicables de suppression et de cessation du traitement doivent être exécutées avant toute reprise du traitement. La préservation nécessaire en vue d'un différend doit avoir un fondement précis, des finalités limitées et faire l'objet d'un réexamen périodique; le présent paragraphe n'autorise aucune conservation indéfinie.

10.4 Les obligations générales de confidentialité subsistent pendant trois ans après la fin de la Convention. Les renseignements qui constituent toujours un secret commercial au regard du droit applicable demeurent protégés aussi longtemps qu'ils conservent ce caractère. La durée de conservation des renseignements personnels doit être fixée séparément selon le critère de nécessité et le droit applicable; elle n'est pas automatiquement prolongée par la durée des obligations de confidentialité.

## Article 11 Responsabilité et recours

11.1 La Partie qui manque à la Convention engage sa responsabilité selon le droit applicable, compte tenu de ses actes, du lien de causalité et du préjudice prouvable. La Partie lésée peut légalement demander la cessation de l'atteinte, la restitution ou la destruction des copies contrefaisantes, des mesures correctives, des dommages-intérêts et d'autres recours, et doit prendre des mesures raisonnables pour limiter son préjudice. Le préjudice, les profits, la causalité et la responsabilité sont déterminés selon la loi et les preuves, sans que l'appréciation unilatérale de la Société soit définitive.

11.2 La divulgation de secrets commerciaux, l'extraction de modèles ou d'autres atteintes à la propriété intellectuelle peuvent causer un préjudice que des dommages-intérêts ne suffisent pas à réparer. La Partie concernée peut demander les injonctions, mesures de préservation de la preuve et autres mesures provisoires ou définitives permises par la loi. Lorsque le droit le permet, la Société peut également demander la restitution des profits tirés de l'atteinte, des dommages-intérêts préétablis par la loi ou d'autres recours, sans double indemnisation du même préjudice. Le tribunal détermine les conditions du recours; le présent paragraphe ne dispense pas à l'avance des exigences de preuve, de cautionnement ou d'autres exigences légales.

11.3 La Convention n'exclut ni ne limite la responsabilité pour le préjudice matériel causé par une faute intentionnelle ou lourde, le préjudice corporel ou moral, ni les responsabilités relatives aux renseignements personnels, dommages-intérêts légaux ou autres responsabilités dont la limitation est interdite. Lorsque la Loi sur la protection du consommateur du Québec ou d'autres règles impératives de consommation s'appliquent, la Convention ne peut exclure ou limiter les conséquences des actes de la Société ou de ses représentants lorsque la loi l'interdit. Toutes les dispositions demeurent soumises aux règles relatives aux clauses abusives des contrats d'adhésion et aux autres règles impératives, sans priver quiconque de recours auxquels il ne peut renoncer.

11.4 Le Participant qui cause un préjudice à la Société par violation de confidentialité, atteinte à ses droits de propriété intellectuelle, extraction ou utilisation non autorisée de modèles, utilisation interdite de résultats, contournement malveillant des contrôles d'accès ou autre manquement doit réparation conformément au droit applicable. La Convention ne fixe aucun plafond monétaire prédéterminé à cette responsabilité. La Société peut réclamer les pertes prouvables juridiquement causées par ces actes, notamment les profits perdus et frais raisonnables de remédiation lorsqu'ils sont recouvrables, ainsi que d'autres recours applicables. La responsabilité et son montant sont déterminés par la loi et les preuves; la Société assume le fardeau de preuve qui lui incombe. La Convention n'impose aucune amende automatique ni pénalité contractuelle forfaitaire.

11.5 Si une réclamation d'un tiers contre la Société découle de l'absence de droit du Participant de fournir des contenus, d'une violation des restrictions d'utilisation ou d'une atteinte aux droits d'un tiers, le Participant doit, dans la mesure de sa responsabilité légale, indemniser la Société des obligations constatées par un jugement définitif ou un règlement raisonnable qu'il a préalablement approuvé par écrit, ainsi que des frais nécessaires légalement recouvrables. La Société doit l'en aviser dans un délai raisonnable et lui permettre de participer à la défense. Sans son consentement écrit, elle ne peut reconnaître une responsabilité ou accepter des obligations non pécuniaires en son nom. Le Participant ne répond pas de la part causée par la faute de la Société ou une utilisation dépassant l'autorisation. Les frais judiciaires et honoraires d'avocat sont régis par la loi et les décisions du tribunal; le présent paragraphe ne les transfère pas automatiquement en totalité.

## Article 12 Droit applicable différends et langue du contrat

12.1 La formation, la validité, l'interprétation et l'exécution de la Convention, ainsi que le règlement des différends qui en découlent, sont régis par le droit du Québec et les lois fédérales canadiennes applicables dans cette province. L'existence, la portée et les recours relatifs au droit d'auteur, aux brevets, aux marques de commerce et aux droits connexes sont respectivement régis par les dispositions fédérales pertinentes ou les autres règles de propriété intellectuelle légalement applicables.

12.2 Les Parties peuvent d'abord tenter de régler les différends découlant de la Convention par les moyens de communication publiés. Ces discussions n'empêchent aucune Partie de demander sans délai une mesure provisoire ou d'engager une procédure conformément à la loi. Sous réserve des règles impératives contraires, les Parties acceptent la compétence non exclusive des tribunaux compétents du Québec. Les questions relevant légalement de la compétence exclusive de la Cour fédérale du Canada demeurent assujetties aux dispositions correspondantes.

12.3 Pour les Participants au Canada, en Chine continentale et à Taïwan, la Convention n'emporte aucune renonciation aux protections impératives applicables en matière de consommation, de renseignements personnels, de compétence légale ou d'autres matières. Lorsque le traitement déclenche des exigences locales d'information particulière, de consentement distinct, de désignation d'un représentant ou de procédures transfrontalières, la Société doit les respecter avant d'agir. L'acceptation ordinaire de l'essai ne remplace pas ces procédures. Le choix du droit québécois n'exclut pas les autres règles impératives et ne garantit pas que les différends ne puissent être portés qu'au Québec.

12.4 La présente version française est un texte contractuel officiel pouvant être accepté directement, sans signature distincte d'un texte dans une autre langue. Le Participant choisit expressément de contracter en français au moyen de la fenêtre de consentement; la Société consent à ce choix en offrant cette option. Si les Parties souhaitent plutôt être liées par une autre version linguistique, les exigences applicables de l'article 55 de la Charte de la langue française doivent être respectées : lorsque la remise préalable du français est exigée, la Société doit d'abord fournir gratuitement la Convention et les documents connexes en français correspondant à la même révision, avant le choix exprès de l'autre langue. Les exceptions légales, notamment pour les contrats utilisés dans les relations avec l'extérieur du Québec, demeurent soumises à leurs conditions particulières et exigences de choix linguistique. La Société doit conserver les textes effectivement fournis, leur mode de remise et la preuve du choix. Une case cochée ne remplace pas la remise légalement requise du français; la langue d'interface, la nationalité ou la localisation ne remplace pas un choix exprès de langue contractuelle. Les droits linguistiques auxquels il est interdit de renoncer sont préservés; les autres textes linguistiques non valablement acceptés ne sont pas automatiquement incorporés à la Convention.
