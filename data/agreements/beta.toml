## Article 5 Confidential Information and Exceptions

5.1 "Confidential Information" means non-public information that a Party or its authorised representative discloses, provides or makes accessible to the other Party during this beta and that is marked confidential or should reasonably be considered confidential in view of its nature and the circumstances of disclosure. The Party providing the information is the "Disclosing Party", and the Party receiving it is the "Receiving Party". Neither the medium in which information is held nor the presence or absence of a confidentiality marking alone determines its confidential status.

