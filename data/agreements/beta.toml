full_text = '''
## 第一条 协议主体及组成

1.1 本协议由 Syntherisk Technology Inc.（位于加拿大魁北克省，以下简称“公司”）与经公司邀请并依本协议取得测试资格的个人参与者（以下简称“测试方”）订立。双方单独称“一方”，合称“双方”。

1.2 本轮采用个人邀请制。本协议不建立机构客户关系，不因填写单位名称、使用单位邮箱或持有账号而约束测试方所在学校、实验室或企业。机构测试、联合研发及数据处理等专项合作，应另行签署书面协议。

1.3 本协议全文及另行取得有效接受的书面补充协议构成双方的测试约定。拟通过链接纳入的其他合同条款，应在接受前明确提示并提供可阅读、可保存的具体版本；仅在网站其他位置展示不当然使其成为本协议内容。《隐私政策》及依法另行取得的个人信息同意应按各自适用规则处理，不因接受本协议而被概括授权。公司应明确显示当前协议版本、语言及对应隐私政策版本；不同版本不得混用。

## 第二条 电子订约及授权

2.1 公司向获邀且符合第 2.2 款的测试方提供有限测试权限。公司应在提交接受前提供完整、清晰、可保存的协议文本及适用隐私政策，并履行第 12.4 款的语言程序。测试方主动勾选弹窗中的合同接受及合同语言选择项，并点击“同意协议并进入内测”或正式语言版本的同义按钮，其接受意思表示经系统到达公司时，在法定成立、生效条件满足的前提下，本协议成立并生效。勾选项不得预先选中；拒绝或关闭弹窗时，不得开通测试权限。仅浏览、滚动、沉默或选择界面语言，不构成合同接受。

2.2 本轮仅限已达到适用法律规定的成年年龄、具有独立订约能力的个人参加。测试方接受本协议，即确认其符合上述资格，并应如实提供为判断适用法律所必要的所在地信息。公司有合理理由怀疑资格或声明真实性时，可采取必要、适度的核验措施，并在疑问解决前暂停开通或访问；不符合资格的，不予开通或终止测试。

2.3 公司应实际保存可核验的电子接受记录，至少关联测试方账号或邀请标识、由服务端确认的接受时间、实际勾选状态、协议版本与语言、对应完整文本及适用隐私政策版本，并提供可保存的接受确认和文本副本。涉及语言选择、可选训练或依法另行取得的个人信息同意，还应分别记录告知文本、具体目的、授权范围、选择及后续撤回。记录须采用适当的访问限制和完整性保护措施；更正、撤回及重新接受应追加留痕，不得以新版覆盖旧版记录。记录应在合法、必要的期限内保存，并按既定规则到期清除；哈希值不能替代全文，也不能单独证明由谁作出接受。

2.4 接受记录必须先成功写入公司控制的存储并核验完整，再开通测试权限；仅在浏览器内保存勾选状态或展示成功提示，不视为完成该控制。可选训练仅在对应授权记录有效时启用，撤回后应同步阻止后续训练使用。公司应能够向测试方提供其接受记录及对应文本，并保留更正、撤回和版本变更的必要记录。电子记录的证据效力依适用法律判断，不由任何一方单方决定。

## 第三条 测试许可及使用范围

3.1 本轮测试免费，自依法有效接受并获开通之日起开始，至测试方退出、测试资格终止或本轮测试结束时止。公司授予测试方有限、非独占、不可转让、不可分许可的使用许可，仅供本人评估公司已开放的功能并开展非商业性研究评估，不得作为生产服务或向第三方提供收费服务。

3.2 本轮不要求上传文件，但允许在开放的功能中输入分子结构、SMILES 或其他文本。输入范围限于测试方依法有权提供的公开、非敏感材料；存在输入框不构成接收未公开研究或受限制资料的授权。公司可按资源情况设置合理的测试限额并在使用前提示。本轮免费不构成未来服务免费的承诺；收费或自动续费须另行明确约定并取得有效接受。

3.3 测试方不得出借、转售、共享账号或访问凭证，不得未经授权允许第三方访问、规避权限或调用限制、访问其他用户材料、实施破坏性测试或妨碍服务运行。未经公司事先书面许可，不得通过脚本、爬虫、批量查询、多账号或其他方式系统性获取输出、重建数据库、收集训练语料或规避测试限额。发现账号失控或未经授权访问，应及时通知公司。

3.4 除适用法律不得限制的行为或公司事先书面授权外，测试方不得反编译、反汇编、反向工程、提取或蒸馏模型，不得通过系统性探测、提示注入或其他方式获取非公开源代码、权重、参数、系统提示、评分规则或实现方法；不得使用公司保密信息、受保护的产品内容或本协议许可范围内取得的输出，训练、微调、校准或建立用于替代、复制或竞争公司产品的模型、数据集或服务。本款不限制未使用前述受限内容的独立开发、依法不得禁止的研究或其他法定例外。

## 第四条 测试版本

4.1 本产品为内测版本。公司可基于测试、维护、安全或资源需要调整功能；测试服务可能出现中断、错误、结果偏差或数据丢失。除双方另有明确书面约定外，公司不作持续可用、固定响应时间或满足特定用途的保证。当前版本不提供审计功能。测试方应自行保存其依法或依适用制度需要留存的资料。

4.2 产品输出仅供研究评估。测试方应在采购、实验、合成、放大、发表或其他实际应用前，独立核对原始资料、知识产权状态、适用法规和安全条件，并履行所在机构的审批程序。公司不保证生成路线可实施、实验结果可重复，或输出足以证明安全、合规及不侵权。

4.3 本条对产品能力的界定不免除公司依法或依本协议承担的保密、个人信息保护、事件处理或其他不可排除的责任。

## 第五条 保密信息的定义及例外

5.1 “保密信息”指一方或其授权代表在本次测试中向另一方披露、提供或使其接触的非公开信息，且该信息被标示为保密，或依其性质及披露情形应合理认定为保密。提供信息的一方称“披露方”，接收信息的一方称“接收方”。信息载体及是否加注保密标识，不单独决定其保密性质。

5.2 公司的保密信息包括非公开产品界面、功能、缺陷、性能、测试结果、源代码、架构、技术文档、模型权重及参数、算法实现、系统提示、检索与排序方法、评分及校准规则、非公开数据集的选择与组织方式、系统配置、开发计划、商业计划、报价及客户信息，以及披露、推导或重现上述信息的截图、录屏、复制件、导出文件和比较报告。单个组成要素公开，不当然使其尚未公开的组合、实现方式或关联关系失去保密性质；第 5.4 款的例外仍适用。

5.3 测试方在获准范围内向公司提供的非公开反馈、支持沟通及其他依法有权披露的信息，符合第 5.1 款条件的，同样属于其保密信息。本轮不要求上传资料，不因此使自愿提供且应合理保密的信息失去保护；但保密保护不等同于公司同意接收超出第三条及第七条规定范围的材料。

5.4 保密义务不适用于接收方能够以合理证据证明的下列信息：非因其违约而已公开的信息；披露前已合法持有且不负保密义务的信息；从有权披露且不违反保密义务的第三方合法取得的信息；未利用披露方保密信息而独立开发的信息；或披露方书面同意公开的信息。

## 第六条 保密义务及允许披露

6.1 接收方仅可为履行本协议及开展获准测试使用保密信息，并应采取与信息性质及风险相适应、至少达到合理程度的保护措施。未经披露方事先书面同意，不得为自身其他商业目的或任何第三方利益使用、披露、出售或许可使用保密信息。

6.2 接收方仅可向履行上述目的确有必要知悉、已获授权且依法或依约承担充分保密义务的人员披露。接收方应管理其授权人员的接触及使用，并对其依法应负责的行为承担责任。公司使用服务商还应符合第九条及个人信息处理告知。

6.3 未经披露方事先书面许可，不得通过社交媒体、公开或未经批准的群组、代码仓库、论文、课程、会议、客户演示或市场推广披露保密信息；不得将其上传至未经批准的第三方人工智能、翻译或文件处理服务。去除名称或标识，不当然使仍可识别的结构、路线或技术资料失去保密性质。

6.4 依法院命令、法律或有权机关要求必须披露的，接收方应在法律允许且实际可行的范围内事先通知披露方，并将披露限于法定必要范围。向负有职业保密义务且确有必要知悉的法律顾问披露，以及受法律保护的投诉、举报、监管沟通或为公共健康与安全所依法允许的披露，不受本协议不当限制。本款不授权超出适用法律保护范围的公开传播。

6.5 发现保密信息被未经授权访问、使用或披露时，接收方应无不当延迟地通知披露方，并采取合理措施制止侵害、控制影响和配合补救。任何一方均不得因此销毁依法应保存的证据或妨碍法定调查及通知义务。

6.6 未经对方书面同意，任何一方不得将对方名称、商标、标识、参与测试的事实或非公开测试结果用于宣传、背书或案例展示。

## 第七条 用户材料及有限处理授权

7.1 “用户材料”指测试方通过产品输入的分子结构、SMILES、其他文本，以及在获准反馈或支持渠道内提供的内容。键入、粘贴或其他输入同样构成提交，不以是否上传文件为限。测试方应有权提供材料及作出本条许可，不得侵犯第三方权利；不得加入本轮测试不必要的个人信息。材料公开可得，不当然意味着无版权、专利或其他使用限制。

7.2 为提供本轮测试服务，测试方就其有权许可的用户材料，授予公司非独占、免许可费且限于履约所必需范围的处理许可，包括接收、复制、存储、运算、传输材料，生成并交付结果，以及开展与本次测试直接相关的技术支持、安全维护和故障排查。公司仅可向为上述目的确有必要参与、受相应用途及保密限制约束的服务商授予必要的处理权限，并应遵守第九条的告知及保护要求。该许可不转移用户材料的所有权，不授权公开、出售原始材料或供服务商自行利用，也不替代依法所需的个人信息同意。服务终止后，仅可在依法履行资料处置、争议保全或其他必要存续义务的范围内继续处理；保存及删除依第九条和第十条执行。产品评测、校准及模型训练分别适用第 7.3 款和第 7.4 款，不因本款而获得额外授权。

7.3 测试方允许公司将其有权许可的公开、非敏感输入及相应输出中，不含个人信息、测试方或第三方保密信息且不受第三方用途限制的部分，连同符合上述条件的错误标签和质量评分，用于 Syntherisk 产品的内部准确性评测、回归测试、缺陷分析及评分尺度和阈值的校准。上述内容统称“合格测试数据”。该项非独占、免许可费授权限于本协议存续期间及终止后三年内的前述产品改进用途，涉及机器学习模型训练或微调的，须另依第 7.4 款授权。公司应核验来源和使用权限，并在评测前排除不合格内容；账号、邮箱、IP、可关联个人的任务记录及仅作去标识化的数据，不因此成为合格测试数据。

7.4 模型训练或微调仅在测试方另行作出明确、可核验的可选授权后开展，且仅限其有权许可的合格测试数据。当前弹窗中的合同接受及合同语言选择均不构成训练授权。公司应在取得该授权前提供独立《模型训练说明》，列明数据范围、训练目的及方式、参与服务商、处理地区、保存期限、撤回渠道、既有模型的处理及剩余风险，并保存对应版本。授权应通过独立选择界面或其他明确书面方式取得；采用勾选方式的，须默认不勾选。拒绝或撤回训练授权，不影响测试方依本协议使用基本测试功能。相关说明、授权记录或撤回控制尚未就绪时，不得开展训练。授权为非独占、免许可费，仅用于 Syntherisk 产品开发及商业化，不授权服务商为自身或其他客户训练，也不包括公开或转售原始材料。测试方可通过公司网站公布的相应联系渠道撤回授权；公司应停止将相关数据用于后续训练，既有模型的处理依事先明确告知且合法有效的安排执行。涉及个人信息的内容不得以本项授权纳入训练；另有依法有效的专门安排的，依该安排处理。

## 第八条 知识产权及反馈

8.1 “公司技术”包括公司自行开发或依法取得权利的产品、源代码及目标代码、架构、模型及其权重和参数、算法实现、系统提示、检索与排序方法、评分与校准体系、软件接口、文档、非公开数据集的编排、商标、商业秘密及相关改进。公司及其许可方保留各自依法享有的全部权利。测试方仅取得第三条及本条明示的有限使用许可，不因获邀、访问、付款、提出反馈或参与评测而取得公司技术的所有权、共有权、独占权、收益分成权或其他默示许可。

8.2 对公司在输出、报告及其结构、编排和表达中依法享有的权利，公司仅许可测试方在本轮有效测试期间，为本人非商业性研究评估查看、保存和分析获准输出，且须遵守保密及第三方权利限制。未经公司事先书面许可，不得将获准输出用于论文发表、公开演示、对外服务、商业项目、数据集分发或第 3.4 款禁止的模型用途。公司不凭本协议主张独占公共领域的事实、分子结构、科学方法或测试方的既有材料；独立从合法公开来源取得材料的权利，不因其亦出现在输出中而被转移。

8.3 公司不保证输出具有独创性、独占性、可专利性、可注册性或不侵权性；相同或相似输出可能提供给其他测试方。自动生成内容中的权利存在及归属应依法判断；本协议不虚构法律并不承认的权利，也不将用户材料中的既有权利自动转让给公司。测试方对外使用输出前，仍应取得必要许可并遵守第 8.2 款。

8.4 对测试方自愿提交、由其有权许可且不含个人信息、保密信息或第三方受限内容的一般功能建议、缺陷描述及改进意见，测试方授予公司全球性、非独占、免许可费、在相关权利存续期间有效且在法律允许范围内不可撤销的使用许可。公司可为开发、改进、维护及商业化其产品而复制、修改、整合、实施该等反馈，并允许承担用途及保密限制的开发人员或服务商在该范围内使用；该许可可随相关业务或资产一并转让。公司不因使用该等一般反馈而当然负有支付报酬、列名致谢、给予分成或合作资格的义务。本许可不包括公开测试方身份或原始反馈，不构成专利许可或既有研究成果转让；涉及专利、委托开发或其他专项成果的，须另行书面约定。

8.5 测试方不得擅自移除或修改公司及其许可方的版权、商标、保密或来源标识，不得冒称公司技术的作者、发明人、权利人或授权代表。未经公司书面授权，不得利用公司保密信息或其依法享有的技术，为本人或第三方申请、注册、受让或协助取得相关专利、版权登记、商标、域名或其他权利。发生违反本款的申请或登记时，测试方应在法律允许及其可控制范围内配合停止、撤回、更正或办理依法应归公司的权利移转；具体权属依法律及有效书面文件确定，不由公司单方宣布。

8.6 公司依法形成的产品代码、模型、参数、评分方法、评测工具及其他技术改进，其由公司自行开发或依有效许可取得的权利归公司或相应许可方。测试方仅因提供输入、一般反馈、质量评分或测试时间，不自动成为共同作者、共同发明人或共同权利人；确有受法律保护的实质创作或发明贡献时，按适用法律及另行书面约定处理，不以本款否认真实贡献。

8.7 测试方保留其用户材料、既有技术及未使用公司保密信息独立形成的成果中的权利。公司使用反馈及测试数据应分别遵守第 8.4 款和第七条，不得将处理许可解释为全部成果转让。依法不能转让的精神权利等权利不因本协议被视为已转让；需要特定许可、书面转让或依法允许的权利放弃时，应另行明确取得。

8.8 公司可独立研发、改进、许可或商业化其产品及技术，无须取得测试方额外批准，但须遵守本协议中对用户材料、保密信息和个人信息的限制。对开源组件、第三方模型、数据库或其他第三方材料，本协议仅在公司依法有权许可的范围内适用，不扩大第三方授权或取代依法适用的许可证。公司可采取必要、适度的权限控制、限流及停止访问措施保护其技术，并保留依法追究违约或侵权责任的权利。

## 第九条 个人信息及服务商

9.1 公司应在相关收集开始前或依法要求的时点，发布可直接查阅、保存且与实际处理一致的《隐私政策》，并在邀请、接受界面及产品内提供持续可访问的入口。本协议不替代该政策。公司应在其网站公开个人信息保护负责人的职务及联系方式；隐私政策应明确查阅、更正、依法删除、撤回同意和投诉的适用渠道及办理方式。测试方可通过网站公布的相应渠道提出请求。政策及收集时提示应据实说明输入和输出、账号或邀请信息、接受记录、技术记录及其他实际处理的数据类别、来源、用途、法律依据、接收方、处理地区、具体保存期限或确定标准、安全措施、权利渠道及拒绝提供的影响，并突出可能实质影响个人的风险。不得将未经核实的服务商、存储地点、不留存或加密措施写成既成事实；未完成必要核实、告知及适用同意程序的处理，不得启用。

9.2 个人信息的处理应限于已告知且具有合法依据的具体目的，范围符合必要性和比例要求。第七条的数据许可不替代个人信息同意，不自动授权画像、广告、出售资料或第三方自行训练。公司应将访问权限限制于确有履职需要的人员，并在委托处理前落实适当书面安排，明确服务商用途、保密、安全、分包、留存、删除及事件通知义务，核实其是否将资料用于自身目的。公司对其控制的个人信息继续承担适用责任。

9.3 公司应在法律要求时，对涉及个人信息的信息系统或电子服务项目开展隐私影响评估；向魁北克以外提供个人信息或委托境外处理前，应完成适用的评估、书面安排、告知及同意程序。发生或有合理理由怀疑发生个人信息保密事件时，应及时控制风险、调查并保存必要事实、评估损害风险、记录处置情况，并依法通知监管机构及受影响个人。不得以尚未证实泄露或产品没有审计功能为由延迟依法必须采取的措施。

9.4 如实际使用 Cookie、分析工具或其他识别、定位、画像技术，公司应在隐私政策及相关界面据实说明用途、接收方和控制方式，并履行适用的事先告知、启用选择或同意要求。依法应采取最高隐私保护默认设置的，应在启用前落实。对外声明的安全、保存及删除安排须与系统实际配置一致；本款不表示本版本已部署任何特定工具或安全认证。

9.5 公司应将本条落实为实际程序：在开通前核对数据流、服务商及处理地区，确定并公开适用隐私政策；建立最小访问权限、保存及删除规则、权利请求办理和事件响应程序；对依法所需评估和合同安排保留记录。保留期限应按数据类别和具体目的确定，不能以“持续改进”概括永久保存。未经核实的额外处理应保持关闭；负责人应定期复核政策与实际配置是否一致。

## 第十条 期限 终止及资料处置

10.1 本协议自依第二条成立并生效时起适用，至测试方退出、公司依法终止其资格或本轮测试结束时终止。依其性质应继续有效的知识产权归属、反馈许可、保密、责任及争议条款继续适用。

10.2 测试方可随时通过公司网站公布的测试支持或联系渠道申请退出，无须说明理由且不产生退出费用。公司有合理依据认为存在资格不符、泄密、模型提取、知识产权侵害、违法使用或其他实质风险时，可采取必要、适度的访问限制、暂停或终止措施，并在法律允许且实际可行时告知原因及联系渠道。为保护证据或制止持续侵害，可先采取紧急措施，但不据此单方最终认定违约责任。非紧急的本轮测试结束或整体服务取消，原则上至少提前七个日历日通知，并在实际可提供范围内给予保存获准资料的机会。

10.3 终止后，测试方应停止访问产品及使用凭证，停止超出许可期限或范围的输出利用，并删除或返还不再获准持有的公司保密信息、复制件及派生资料；公司提出合理要求时，应确认其可控制范围内的处置。依法或为维护具体权利确需保存的协议、接受确认及证据，可受限保留，原有保密义务继续适用。公司应按合法且已告知的期限处置用户材料及个人信息；备份应依相应清除安排处理，恢复备份后应先执行适用的删除及停止处理要求。必要的争议保全应有具体依据、限制用途并定期复核，不以本条授权无限期留存。

10.4 一般保密义务持续至本协议终止后三年；依法仍构成商业秘密的信息，在其保持商业秘密性质期间持续受保护。个人信息的保存期限应另按必要性及适用法律确定，不因保密期限而自动延长。

## 第十一条 责任及救济

11.1 一方违反本协议，应依适用法律承担与其行为、因果关系及可证明损失相应的责任。守约方可依法请求停止侵害、返还或销毁侵权复制件、采取补救措施、赔偿损失及其他救济，并应采取合理措施减少损失。损害、获利、因果关系和应负责任均按适用法律及证据确定，不以公司单方认定为最终依据。

11.2 泄露商业秘密、提取模型或其他知识产权侵害可能造成金钱赔偿难以充分弥补的损害。受影响方可依法申请禁令、保全证据或其他临时及最终救济。公司在法律允许时还可主张侵权获利返还、法定赔偿或其他适用救济，但不得就同一损害重复受偿。法院依法决定救济条件；本款不预先免除举证、担保或其他法定要求。

11.3 本协议不排除或限制故意或重大过错造成的财产损害责任、人身损害或精神损害责任，亦不排除法律禁止限制的个人信息责任、法定赔偿或其他责任。适用魁北克《消费者保护法》或其他强制性消费者规则时，本协议不得免除或限制依法不得排除的公司或其代表的行为所产生的责任。各项条款均受格式合同中不公平条款及其他强制性规定约束，不得剥夺依法不可放弃的救济。

11.4 测试方因泄密、侵害公司知识产权、未经授权提取或利用模型、违规利用输出、恶意规避访问限制或其他违约造成公司损失的，应依法承担赔偿责任；本协议不设预定赔偿金额上限。公司可依法主张与该行为具有法律上因果关系的可证明损失，包括依法可赔的利润损失及合理补救支出，并请求其他适用救济。赔偿责任及数额应依据适用法律和证据确定，公司依法承担相应举证责任；本协议不设自动罚款或固定违约金。

11.5 因测试方无权提供材料、违反使用限制或侵害第三方权利而引发针对公司的第三方请求，测试方应在其依法应负责任的范围内，赔偿经生效裁判确认或经其事先书面认可的合理和解责任及依法可追偿的必要费用。公司应合理及时告知并提供参与抗辩的机会，未经测试方书面同意，不得代表其承认责任或承担非金钱义务。因公司自身过错或超出授权使用造成的部分，不由测试方承担；诉讼费用及律师费的承担须符合法律和法院决定，不因本款自动全额转嫁。

