## 二 您的同意和选择

这份政策说明我们如何处理个人信息。阅读政策、接受内测协议或选择合同语言，并不等于同意所有可选用途。我们只为明确、合法且必要的目的收集和使用个人信息，并根据信息的敏感程度和您的合理预期，采用适当的同意方式。只有法律明确允许时，我们才会在规定范围内不经同意处理。

需要征求同意时，我们会说明涉及哪些信息、用来做什么、交给谁处理，以及可以合理预见的重要影响。书面同意请求会与其他信息分开呈现，敏感个人信息依法取得明示同意。如果要改变原有用途，或增加尚未获得有效授权的用途，我们会先向您说明，并在法律要求时重新取得同意。

您可以拒绝或撤回可选授权，仍然使用基本测试功能。如果某项信息确实是识别账号、安全验证或完成您请求的功能所必需的，拒绝提供可能使该功能无法使用，我们会向您说明原因。我们不会要求您以提供无关信息为条件参加测试。撤回授权不影响此前已经合法进行的处理，法律要求保留的记录也仍需保存。

我们不出售或出租个人信息，也不将其用于行为广告、跨网站追踪或服务商自己的模型训练。参加内测不会让您自动订阅营销邮件。如果以后开展可选营销或其他新用途，我们会先履行相应的告知和同意要求，并提供方便的退出方式。

## 三 产品评测和模型训练

根据您有效接受的《Syntherisk 内测使用与保密协议》第 7.3 款，我们可以在非独占、免许可费的许可范围内，使用“合格测试数据”进行 Syntherisk 产品内部准确性评测、回归测试、缺陷分析，以及评分尺度和阈值校准。合格测试数据仅包括您有权许可的公开、非敏感输入及相应输出，以及符合相同条件的错误标签和质量评分；不得含有个人信息、测试方或第三方保密信息，也不得受到第三方用途限制。我们会在评测前核验来源和使用权限，排除不合格内容。该授权仅在内测协议存续期间及终止后三年内有效，不包括模型训练或微调。

账号、邮箱、IP 地址和能关联到个人的任务记录，不属于上述合格测试数据。删掉姓名或改用编号，也不一定使数据失去个人信息属性。只有依法完成匿名化、进行风险评估并达到无法合理识别个人的标准，才可按匿名信息处理；否则仍适用本政策。

根据内测协议第 7.4 款，模型训练或微调需要您另行作出明确、可核验的可选授权；仅接受内测协议、阅读本政策或选择合同语言，不构成该授权。我们会事先单独提供《模型训练说明》，并保留授权记录；使用复选框时，默认不勾选。说明将交代数据范围、训练目的和方式、服务商、处理地区、保存期限和撤回渠道，以及撤回后已训练模型的处理安排与剩余风险。在说明、授权记录和撤回控制准备妥当前，不开展训练。

训练授权仅限于您有权许可的合格测试数据，不包括个人信息，也不允许服务商用这些数据为自己或其他客户训练模型。拒绝或撤回授权，都不影响基本测试功能。撤回后，我们会停止将相关数据用于后续训练；已训练模型按事先向您说明且合法有效的安排处理，不保证能够立即从模型中消除相关数据的影响。

分子分析和质量评分针对的是分子或研究任务。本轮测试不使用个人信息作出完全自动化的个人决定，包括个人参与资格决定。如果以后引入这类功能，我们会依法告知，说明所用个人信息、主要因素、参数和理由，并允许您更正信息，向有权复核决定的人员提出意见。

## 四 Cookie 和类似技术

网站可能使用 Cookie 或浏览器本地存储，维持登录状态、完成安全校验，或记住您的语言和隐私选择。只有相关功能实际启用且确有需要时，才使用这些技术，并说明用途、有效期和接收方。您可以在浏览器中管理或删除记录，但禁用必要功能可能影响登录，或使网站无法记住您的选择。

本轮测试默认关闭非必要的分析、广告、定位和画像技术。如以后需要使用，我们会先说明其功能、收集的信息、接收方和控制方式，并依法由您主动启用或表示同意，不会以默认勾选或未作回应代替您的选择。拒绝非必要技术不影响基本测试功能。产品提供的隐私设置，依法默认采用最高保护级别。

## 五 谁可以接触您的信息

公司内部人员只有在工作确有需要时才能接触个人信息。例如，账号管理人员处理邀请和权限，技术及支持人员解决运行问题，个人信息保护负责人处理请求和投诉。负责法律或安全事务的人员，也可能在处理具体争议或事件时接触必要资料。每个人的访问范围限于其工作所需，并须遵守保密和用途限制。

部分功能可能由服务商提供，包括网站托管、云基础设施、数据库、认证和邮件、运算或模型接口，以及技术支持和安全服务。我们只提供完成相应工作所需的信息：账号和邮件服务使用必要的身份及联系信息，运算或模型接口处理任务内容和必要标识，托管及安全服务可能处理技术记录。与您使用的功能无关的服务商，不会因此取得您的信息。

委托服务商前，我们会用书面合同明确数据用途、保密、安全、分包、保存、删除、事件通知和核查要求，限制其将信息用于自身目的。交由服务商处理后，我们仍对所控制的信息承担相应责任。法律、会计等专业顾问也只有在办理具体事项需要且法律允许时，才能取得相关信息。

向其他主体提供个人信息，需要取得相应同意，或有法律明确允许、要求的理由，例如响应有效法律程序、履行法定报告义务或处理法律规定的紧急情况。融资、合并或业务转让涉及个人信息时，我们只在法律允许且确有必要的范围内提供，并落实专门的保密和用途限制。交易未完成或信息不再需要时，依法返还或销毁；交易完成后，按法律要求通知。

## 六 魁北克以外的信息处理

服务商及其分包方可能在魁北克以外存储、处理或远程访问个人信息，包括加拿大其他省份和其他国家。因此，信息不一定只保存在魁北克或加拿大，也可能受到处理地法律，以及当地政府或法院依法提出的请求影响。

向魁北克以外提供个人信息，或委托当地机构收集、使用、披露或保存信息前，我们会完成法律要求的隐私影响评估，确认信息能够得到适当保护，并签订反映评估结果和风险缓解措施的书面协议。所需告知和同意程序也须先行完成，条件未满足时不启用相关处理。您可以联系负责人，了解涉及您信息的接收方类别、处理地区和保护安排。

## 七 保存多久以及如何删除

我们只在完成已说明的用途所需的时间内保存个人信息。以下是本轮测试的默认期限；除法律要求、具体争议保全或其他合法必要原因外，到期删除。您也可以提前提出删除请求，办理方式见第九节。我们会说明哪些信息可以删除，哪些仍需依法保留。

邀请与账号信息：未激活的邀请信息，在邀请失效后三十日内删除。普通账号资料，在您退出或本轮测试结束后三十日内删除，以先发生的时间为准。协议接受证据按下文的独立期限保留，不因此继续保存整个账号或全部任务。

任务输入与输出：从任务完成之日起最多保存三十日，用于交付结果和处理相关故障。必要技术记录最多保存九十日。支持及投诉往来通常保留至事项结案后十二个月；其中属于法定权利请求或需继续保全的部分，按法律要求或具体必要期限保存。

接受与选择记录：在您参与测试期间及参与终止后三年内，保留证明告知、协议接受、授权和撤回所需的最少记录。三年期限只适用于这些必要证据，不适用于全部个人信息；不再需要的内容会提前删除。

法律要求或特殊情况：用于对个人作出决定的信息，至少保存至决定作出后一年。个人信息保密事件的登记信息，至少保存至公司知悉事件之日或期间后五年。法律、监管要求或具体争议需要保留其他材料时，我们只保存必要部分，限制其他使用，并在保留理由消失后按本政策处置。

删除与备份：确认可删除的范围后，在线信息原则上在三十日内清除。备份中的相应内容，在在线删除后最长九十日内随备份轮换清除，期间不用于日常业务。如需恢复备份，会重新执行相关删除限制。法律要求更早处理的，我们按该要求办理；技术删除进度不会延长权利请求的法定回复期限。

合格的非个人测试数据，按第三节及有效授权处理。只要信息仍能识别个人，即使改用编号、暂时与账号分开，或被列为研发资料，仍适用个人信息的保存期限。未达到法定匿名化标准的，也不能视为已经删除或不再受个人信息保护。

## 八 信息安全与事件处理

我们根据个人信息的敏感程度、用途、数量、分布和存储方式，采取相应的管理、物理和技术保护措施，限制访问权限和不必要的复制。个人信息保护负责人监督保存、销毁、请求办理和投诉程序。涉及个人信息的信息系统或电子服务项目，按法律要求开展隐私影响评估，并在设计阶段考虑保护措施。

一旦发生或有合理理由怀疑发生未经授权的访问、使用、披露、丢失等个人信息保密事件，我们会采取合理措施控制风险、调查原因、防止再次发生，并记录处理情况。存在严重损害风险时，我们会按魁北克法及时通知监管机构和受影响人员；PIPEDA 适用时，也履行相应的报告、通知和记录义务。通知会说明法律要求告知的事实、风险、应对措施和联系方式。

网络服务无法排除所有风险。请保管好登录凭据，只提交测试所需且您有权提供的材料，发现异常时及时联系我们。公司仍须履行法律规定的保护义务，您的投诉和救济权利也不受这些提醒影响。

## 九 您如何管理个人信息

您可以向个人信息保护负责人提出书面请求，确认我们是否持有您的个人信息、查阅信息或取得副本，也可以了解其来源、用途、可访问人员和接收方类别，以及保存期限。如果信息不准确、不完整、有歧义，或收集、披露、保存不符合法律要求，您可以依法要求更正或采取相应措施。

符合法定条件时，您可以要求以结构化、常用的技术格式，取得我们通过计算机收集自您的个人信息，或将其传输给您指定且依法有权收集的主体。这项权利不当然包括我们创作或推断的信息，并受法律规定的严重实际困难等限制。内测协议中的知识产权条款，不会排除您的法定个人信息权利。

您可以撤回可选处理的同意，或要求删除已不再需要、或依法不得继续保存的信息。如部分信息仍需依法保留，我们会说明原因、期限或确定期限的标准，以及使用限制。对于已经公开传播的信息，您也可以在法定条件下要求停止传播、取消索引或重新建立索引。

收到访问或更正请求后，我们会尽快处理，最迟在收到请求之日起三十日内书面回复。必要时，我们会协助您说明请求内容；其他请求也会按适用法律及时办理。核实身份或内部转交不会自动重新计算法定期限。如果无法满足全部或部分请求，我们会说明理由、适用条文，以及您可以采取的救济途径和期限。

查阅个人信息原则上免费。如果依法可收取合理的复制、转录或传输费用，我们会事先告知预计金额。提出隐私请求、拒绝可选用途或依法投诉，不会使您失去与该事项无关的基本测试资格。

## 十 投诉与监管救济

如果您认为我们没有按本政策或法律处理个人信息，可以通过文首的联系邮箱或网站入口投诉。请说明相关账号或联系方式、遇到的问题，以及希望如何解决。个人信息保护负责人会调查并记录处理结果，向您说明决定和相应的纠正措施。涉及访问或更正请求的部分，仍按法定期限办理。

您也可以依法向魁北克信息获取委员会（Commission d’accès à l’information du Québec，CAI）寻求救济。属于 PIPEDA 管辖的事项，可向加拿大隐私专员办公室（Office of the Privacy Commissioner of Canada，OPC）反映。请留意相应机构公布的受理条件、程序和期限；公司内部处理不会替代监管救济，也不会延长法定期限。

官方办理入口：CAI 隐私权利及救济；OPC 隐私问题与投诉。

## 十一 政策更新与其他文件

个人信息的处理须符合适用法律、本政策和收集时向您提供的说明。内测协议第 7.3 款的非个人测试数据评测许可、第 7.4 款的单独模型训练授权，以及协议中的保密和知识产权条款，均不构成对个人信息处理的额外授权。第三方网站独立处理信息时适用其隐私政策；对于我们委托处理的信息，服务商自己的政策不能替代公司的责任。

我们会在网站公布本政策及修订说明，标明版本和更新日期，并在收集相关信息前提供可以阅读和保存的文本。如果修订涉及用途、共享、处理地区或其他重要权益，我们会在实施前以适当方式通知您，并在法律要求时重新取得同意。仅更新网页、您继续访问或未回复通知，都不能代替法律要求的新同意。
