3.1 This beta is free of charge. Participation begins upon legally valid acceptance and activation of access and ends when the Participant withdraws, eligibility is terminated or this beta ends. The Company grants the Participant a limited, non-exclusive, non-transferable and non-sublicensable licence solely to evaluate the features made available by the Company and conduct personal, non-commercial research and evaluation. The product must not be used as a production service or to provide paid services to third parties.

