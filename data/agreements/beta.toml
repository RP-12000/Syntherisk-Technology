Syntherisk Technology Inc. (« nous » ou la « Société ») est établie au Québec, au Canada. Cette Politique explique comment nous recueillons, utilisons et protégeons les renseignements personnels lorsque vous visitez notre site, participez à l'essai bêta ou nous contactez. Elle décrit aussi vos droits. Cette phase d'essai est gratuite, accessible sur invitation et réservée aux personnes ayant atteint l'âge de la majorité dans leur lieu de résidence.

Un renseignement personnel permet de vous identifier directement ou, en le combinant avec d'autres renseignements, indirectement. Par exemple, une structure moléculaire ou une chaîne SMILES ne permet pas nécessairement d'identifier quelqu'un à elle seule. Elle peut toutefois devenir un renseignement personnel si elle est liée à un compte, à l'identité d'un chercheur ou à d'autres dossiers personnels. Cette Politique couvre aussi les renseignements personnels dont nous confions le traitement à des prestataires.

Nous traitons les renseignements personnels conformément à la Loi sur la protection des renseignements personnels dans le secteur privé du Québec et aux autres lois applicables. La Loi sur la protection des renseignements personnels et les documents électroniques du Canada (LPRPDE) peut aussi s'appliquer aux activités commerciales et aux flux interprovinciaux ou internationaux de renseignements. Nous en respectons les exigences applicables. Cette Politique ne limite aucun droit auquel vous ne pouvez renoncer en vertu des lois de votre lieu de résidence.

## 1 Les renseignements que nous recueillons

Les renseignements recueillis proviennent de ce que vous nous fournissez, des traces de nos échanges et des données techniques nécessaires au fonctionnement du service. Avant la collecte, ou au moment prévu par la loi, nous expliquons les fins poursuivies et indiquons quels renseignements sont nécessaires à une fonctionnalité. Les renseignements recueillis dépendent des fonctionnalités et des moyens de communication que vous utilisez.

Lorsque vous acceptez une invitation, créez un compte ou vous connectez, nous pouvons vous demander une adresse courriel, un nom d'affichage et la confirmation de votre majorité. Nous utilisons ces renseignements, ainsi que les identifiants d'invitation et de compte, pour vérifier votre admissibilité, gérer vos droits d'accès et envoyer les avis de service nécessaires. En principe, nous vérifions seulement que vous avez atteint l'âge de la majorité, sans demander votre date de naissance complète ni de document d'identité.

Lorsque vous utilisez l'analyse moléculaire, nous traitons les structures moléculaires, les chaînes SMILES et les autres textes que vous saisissez ou collez, ainsi que les résultats générés, les heures et identifiants des tâches et les renseignements d'erreur nécessaires. Ils servent à effectuer les calculs, à vous fournir les résultats et à résoudre les problèmes connexes. Même si le produit actuel ne nécessite pas le téléversement de fichiers, le contenu saisi ou collé est bien transmis au service.

Lorsque vous nous contactez ou signalez un problème, nous utilisons vos coordonnées, la description du problème et nos échanges pour répondre, traiter les plaintes ou corriger des défauts. Veuillez ne fournir que ce qui est nécessaire à la résolution du problème. Si une autre personne nous fournit vos renseignements, nous vérifions d'abord que la collecte respecte la loi et vous en indiquons la source selon les exigences légales.

La visite du site ou l'utilisation du produit peut générer des données sur l'adresse IP, l'heure d'accès, le navigateur, le type d'appareil, l'état des requêtes, les anomalies de connexion et les erreurs. Nous utilisons ces données nécessaires uniquement pour faire fonctionner et sécuriser le service, prévenir les abus et résoudre les problèmes. Le dépannage n'entraîne pas par défaut l'enregistrement des mots de passe ni la copie de tous les textes libres dans les journaux techniques. La section 4 explique les témoins et les technologies similaires.

Lorsque vous acceptez une convention ou faites un choix d'autorisation, nous conservons l'identifiant du compte ou de l'invitation, le moment réel de l'acceptation, les versions de la convention et des avis, la langue contractuelle, vos choix, ainsi que les modifications ou retraits ultérieurs. Ces traces permettent de vérifier les explications reçues et les choix faits, de gérer les accès et de régler les différends. Le produit ne dispose actuellement d'aucune fonction d'audit; nous devons néanmoins conserver les preuves d'acceptation et les données de sécurité nécessaires conformément à la loi.

Cet essai ne nécessite aucun renseignement personnel sensible, notamment sur des patients ou des participants à la recherche, sur la santé, la génétique ou les finances, ni de renseignements d'identité concernant d'autres personnes. Veuillez ne pas les inclure dans vos saisies ou vos demandes d'assistance. En cas d'envoi accidentel, contactez le responsable de la protection des renseignements personnels. Nous limiterons toute utilisation ultérieure et, selon la situation et les exigences légales, supprimerons ou retournerons les renseignements, ou conserverons les éléments de preuve nécessaires.

## 2 Votre consentement et vos choix

Cette Politique explique comment nous traitons les renseignements personnels. La lire, accepter la Convention d'essai bêta ou choisir une langue contractuelle ne signifie pas consentir à toutes les utilisations facultatives. Nous recueillons et utilisons les renseignements personnels uniquement à des fins déterminées, légitimes et nécessaires. La forme du consentement tient compte de la sensibilité des renseignements et de vos attentes raisonnables. Nous ne les traitons sans consentement que dans les cas et les limites expressément permis par la loi.

Lorsque nous demandons votre consentement, nous expliquons les renseignements visés, les fins poursuivies, les destinataires du traitement et les conséquences importantes raisonnablement prévisibles. Les demandes écrites de consentement sont présentées séparément des autres informations; les renseignements sensibles font l'objet d'un consentement exprès lorsque la loi l'exige. Avant de modifier une fin existante ou d'ajouter une fin non valablement autorisée, nous vous expliquons le changement et obtenons un nouveau consentement lorsque requis.

Vous pouvez refuser ou retirer une autorisation facultative tout en continuant à utiliser les fonctionnalités de base de l'essai. Si un renseignement est réellement nécessaire pour identifier un compte, effectuer une vérification de sécurité ou fournir une fonctionnalité demandée, votre refus peut empêcher son fonctionnement. Nous vous en expliquerons la raison. Nous ne conditionnons pas la participation à la fourniture de renseignements sans rapport avec le service. Le retrait n'affecte pas les traitements licites déjà effectués, et les dossiers dont la loi exige la conservation restent conservés.

Nous ne vendons ni ne louons les renseignements personnels. Nous ne les utilisons pas à des fins de publicité comportementale, de suivi entre sites ou d'entraînement de modèles pour le compte propre d'un prestataire. La participation à l'essai ne vous abonne pas automatiquement à des courriels promotionnels. Si nous proposons plus tard des communications promotionnelles facultatives ou de nouvelles utilisations, nous respecterons d'abord les exigences d'information et de consentement et offrirons un moyen simple de se retirer.

## 3 Évaluation du produit et entraînement des modèles

Conformément au paragraphe 7.3 de la Convention d'utilisation et de confidentialité pour l'essai bêta de Syntherisk que vous avez valablement acceptée, nous pouvons utiliser les « Données d'essai admissibles » dans le cadre d'une licence non exclusive et sans redevances pour l'évaluation interne de l'exactitude, les tests de régression, l'analyse des défauts et la calibration des échelles et seuils de notation des produits Syntherisk. Ces données comprennent uniquement les saisies publiques et non sensibles et les résultats correspondants que vous avez le droit de concéder sous licence, ainsi que les étiquettes d'erreur et les notes de qualité remplissant les mêmes conditions. Elles ne doivent contenir aucun renseignement personnel ni renseignement confidentiel du Participant ou d'un tiers, et ne doivent pas être soumises à des restrictions d'utilisation imposées par un tiers. Nous vérifions les sources et les droits d'utilisation avant l'évaluation et excluons les contenus inadmissibles. Cette autorisation vaut uniquement pendant la Convention et durant les trois années suivant sa fin. Elle ne couvre ni l'entraînement ni l'ajustement des modèles.

Les comptes, les adresses courriel, les adresses IP et les historiques de tâches pouvant être associés à une personne ne constituent pas des Données d'essai admissibles. Retirer un nom ou le remplacer par un numéro ne suffit pas nécessairement à enlever le caractère personnel des renseignements. Nous ne les traitons comme anonymes qu'après une anonymisation conforme à la loi, une évaluation des risques et l'atteinte de la norme légale selon laquelle il n'est plus raisonnablement possible d'identifier une personne. Sinon, cette Politique continue de s'appliquer.

Le paragraphe 7.4 de la Convention exige une autorisation facultative, expresse et vérifiable, donnée séparément, pour l'entraînement ou l'ajustement des modèles. Accepter la Convention, lire cette Politique ou choisir une langue contractuelle ne constitue pas cette autorisation. Nous fournirons au préalable un Avis sur l'entraînement des modèles distinct et conserverons les preuves d'autorisation. Toute case sera décochée par défaut. L'Avis précisera les données visées, les fins et méthodes d'entraînement, les prestataires, les lieux de traitement, les durées de conservation, les moyens de retrait, le traitement des modèles déjà entraînés après un retrait et les risques résiduels. Aucun entraînement ne commencera avant la mise en place de l'Avis, des preuves d'autorisation et des mécanismes de retrait.

L'autorisation d'entraînement porte uniquement sur les Données d'essai admissibles que vous avez le droit de concéder sous licence. Elle exclut les renseignements personnels et ne permet pas aux prestataires d'utiliser ces données pour entraîner des modèles pour eux-mêmes ou pour d'autres clients. Le refus ou le retrait n'affecte pas les fonctionnalités de base de l'essai. Après un retrait, nous cessons d'utiliser les données concernées pour les entraînements ultérieurs. Les modèles déjà entraînés sont traités selon les modalités communiquées au préalable et juridiquement valides; nous ne garantissons pas de pouvoir supprimer immédiatement l'influence des données sur un modèle.

L'analyse moléculaire et les notes de qualité portent sur des molécules ou des tâches de recherche. Cet essai n'utilise pas de renseignements personnels pour prendre des décisions concernant une personne sur la base exclusive d'un traitement automatisé, y compris des décisions d'admissibilité. Si nous ajoutons de telles fonctionnalités, nous fournirons les avis requis par la loi, expliquerons les renseignements utilisés ainsi que les principaux facteurs, paramètres et raisons de la décision, et vous permettrons de faire rectifier les renseignements et de présenter vos observations à une personne habilitée à réviser la décision.

## 4 Témoins et technologies similaires

Le site peut utiliser des témoins ou le stockage local du navigateur pour maintenir une session, effectuer des vérifications de sécurité ou mémoriser vos choix de langue et de confidentialité. Nous n'utilisons ces technologies que lorsque la fonctionnalité est activée et qu'elles sont nécessaires, en précisant leurs fins, leur durée et leurs destinataires. Vous pouvez les gérer ou les supprimer dans votre navigateur. La désactivation des fonctions nécessaires peut toutefois affecter la connexion ou empêcher le site de mémoriser vos choix.

Les technologies non nécessaires d'analyse, de publicité, de localisation et de profilage sont désactivées par défaut pour cet essai. Si nous souhaitons les utiliser plus tard, nous expliquerons d'abord leur fonctionnement, les renseignements recueillis, les destinataires et les moyens de contrôle. Vous devrez les activer vous-même ou y consentir selon la loi. Nous ne remplaçons pas votre choix par des cases précochées ou par une absence de réponse. Refuser les technologies non nécessaires n'affecte pas les fonctionnalités de base. Les paramètres de confidentialité offerts par le produit assurent par défaut le plus haut niveau de protection, conformément à la loi.

## 5 Qui peut accéder à vos renseignements

Le personnel de la Société n'accède aux renseignements personnels que lorsque ses fonctions le nécessitent. Par exemple, les responsables des comptes gèrent les invitations et les permissions, les équipes techniques et d'assistance règlent les problèmes de fonctionnement, et le responsable de la protection des renseignements personnels traite les demandes et les plaintes. Le personnel chargé des questions juridiques ou de sécurité peut aussi avoir besoin de certains renseignements pour un différend ou un incident précis. Les accès de chacun se limitent à ses tâches et sont soumis à des obligations de confidentialité et à des restrictions d'utilisation.

Des prestataires peuvent assurer certaines fonctions : hébergement du site, infrastructure infonuagique, bases de données, authentification, courriel, interfaces de calcul ou de modèles, assistance technique et sécurité. Nous ne leur fournissons que les renseignements nécessaires au travail confié. Les services de compte et de courriel utilisent les renseignements d'identité et les coordonnées nécessaires; les interfaces de calcul ou de modèles traitent le contenu des tâches et les identifiants nécessaires; les services d'hébergement et de sécurité peuvent traiter des données techniques. Les prestataires sans lien avec les fonctionnalités que vous utilisez ne reçoivent pas vos renseignements du seul fait qu'ils nous fournissent des services.

Avant de confier des renseignements à un prestataire, nous fixons dans un contrat écrit les exigences relatives aux fins, à la confidentialité, à la sécurité, à la sous-traitance, à la conservation, à la suppression, au signalement des incidents et aux vérifications, et limitons l'utilisation à ses propres fins. Nous demeurons responsables des renseignements sous notre contrôle après en avoir confié le traitement. Les conseillers juridiques, comptables et autres professionnels ne reçoivent les renseignements que si un dossier précis le nécessite et si la loi le permet.

La communication de renseignements personnels à d'autres parties nécessite le consentement approprié ou un motif expressément permis ou exigé par la loi, par exemple une procédure juridique valide, une obligation légale de signalement ou une situation d'urgence prévue par la loi. Lorsqu'un financement, une fusion ou un transfert d'entreprise implique des renseignements personnels, nous ne les communiquons que dans la mesure nécessaire et permise, avec des obligations spécifiques de confidentialité et des restrictions d'utilisation. Si la transaction échoue ou si les renseignements ne sont plus nécessaires, ils sont retournés ou détruits conformément à la loi. Après la transaction, les avis légalement requis sont transmis.

## 6 Traitement à l'extérieur du Québec

Les prestataires et leurs sous-traitants peuvent conserver ou traiter des renseignements personnels à l'extérieur du Québec, ou y accéder à distance depuis un tel lieu, notamment depuis d'autres provinces canadiennes ou d'autres pays. Les renseignements ne restent donc pas nécessairement exclusivement au Québec ou au Canada. Ils peuvent aussi être soumis aux lois du lieu de traitement et à des demandes légales de gouvernements ou de tribunaux locaux.

Avant de communiquer des renseignements personnels à l'extérieur du Québec ou d'y confier leur collecte, leur utilisation, leur communication ou leur conservation à une organisation, nous réalisons l'évaluation des facteurs relatifs à la vie privée requise par la loi. Nous vérifions que les renseignements bénéficieront d'une protection adéquate et concluons une entente écrite tenant compte de l'évaluation et des mesures d'atténuation des risques. Les démarches d'information et de consentement requises doivent également être terminées avant le traitement. Celui-ci n'est pas activé tant que ces conditions ne sont pas remplies. Vous pouvez contacter le responsable pour connaître les catégories de destinataires, les lieux de traitement et les mesures de protection concernant vos renseignements.

## 7 Conservation et suppression

Nous conservons les renseignements personnels uniquement pendant la durée nécessaire aux fins expliquées. Les durées ci-dessous sont celles prévues par défaut pour cet essai. Les renseignements sont supprimés à leur échéance, sauf obligation légale, conservation nécessaire à un différend précis ou autre motif légitime et nécessaire. Vous pouvez aussi demander une suppression anticipée selon la section 9. Nous vous expliquerons quels renseignements peuvent être supprimés et lesquels doivent encore être conservés en vertu de la loi.

Invitations et comptes : Les renseignements liés à une invitation non activée sont supprimés dans les 30 jours suivant son expiration. Les renseignements ordinaires du compte sont supprimés dans les 30 jours suivant votre départ de l'essai ou la fin de cette phase d'essai, selon la première éventualité. Les preuves d'acceptation de la Convention suivent la durée distincte ci-dessous; leur conservation ne justifie pas celle de l'ensemble du compte ou des tâches.

Saisies et résultats des tâches : Ils sont conservés au plus 30 jours après l'achèvement de la tâche pour fournir les résultats et résoudre les problèmes connexes. Les données techniques nécessaires sont conservées au plus 90 jours. Les échanges d'assistance et de plainte sont normalement conservés pendant 12 mois après la clôture du dossier. Les éléments liés à l'exercice de droits légaux ou devant être préservés plus longtemps le sont pendant la durée légale ou spécifiquement nécessaire.

Preuves d'acceptation et de choix : Pendant votre participation et durant les trois années suivant sa fin, nous conservons les éléments minimaux nécessaires pour établir les avis fournis, l'acceptation de la Convention, les autorisations et les retraits. Cette durée de trois ans ne concerne que les preuves nécessaires, et non l'ensemble des renseignements personnels. Les éléments devenus inutiles sont supprimés plus tôt.

Obligations légales et situations particulières : Les renseignements utilisés pour prendre une décision concernant une personne sont conservés au moins un an après celle-ci. Les renseignements du registre des incidents de confidentialité sont conservés pendant au moins cinq ans après la date ou la période où la Société a pris connaissance de l'incident. Si la loi, une exigence réglementaire ou un différend précis impose la conservation d'autres éléments, nous ne gardons que le nécessaire, limitons les autres utilisations et les traitons selon cette Politique lorsque le motif de conservation disparaît.

Suppression et sauvegardes : Après confirmation du périmètre pouvant être supprimé, les renseignements des systèmes actifs sont normalement effacés dans les 30 jours. Les éléments correspondants des sauvegardes sont supprimés au fil de leur rotation, au plus tard 90 jours après leur effacement des systèmes actifs. Entre-temps, ils ne servent pas aux activités courantes. En cas de restauration, les restrictions de suppression sont réappliquées. Si la loi exige une action plus rapide, nous la respectons. Les délais techniques d'effacement ne prolongent pas les délais légaux de réponse aux demandes d'exercice de droits.

Les données d'essai admissibles non personnelles sont traitées selon la section 3 et les autorisations valides. Tant qu'un renseignement permet encore d'identifier une personne, les durées de conservation des renseignements personnels continuent de s'appliquer, même si un nom est remplacé par un numéro, si les données sont temporairement séparées du compte ou si elles sont classées comme matériel de recherche et développement. Sans atteindre la norme légale d'anonymisation, les renseignements ne peuvent être considérés comme supprimés ou soustraits à la protection des renseignements personnels.

## 8 Sécurité et gestion des incidents

Nous appliquons des mesures administratives, physiques et techniques adaptées à la sensibilité, aux fins, à la quantité, à la répartition et au support des renseignements personnels, et limitons les accès et les copies inutiles. Le responsable de la protection des renseignements personnels supervise la conservation, la destruction, le traitement des demandes et les plaintes. Les projets de systèmes d'information ou de services électroniques impliquant des renseignements personnels font l'objet des évaluations des facteurs relatifs à la vie privée requises par la loi, en tenant compte des mesures de protection dès la conception.

Lorsqu'un incident de confidentialité survient, ou que nous avons des motifs raisonnables de croire qu'il est survenu, notamment un accès, une utilisation ou une communication non autorisés, ou une perte de renseignements personnels, nous prenons des mesures raisonnables pour limiter les risques, rechercher les causes, éviter une répétition et documenter notre intervention. En cas de risque de préjudice sérieux, nous avisons rapidement l'autorité compétente et les personnes concernées, conformément au droit québécois. Lorsque la LPRPDE s'applique, nous respectons aussi ses obligations de déclaration, de notification et de tenue de dossiers. Les avis présentent les faits, les risques, les mesures prises et les coordonnées exigés par la loi.

Les services en ligne ne peuvent éliminer tous les risques. Veuillez protéger vos identifiants de connexion, ne transmettre que les contenus nécessaires à l'essai que vous avez le droit de fournir et nous signaler rapidement toute anomalie. La Société demeure tenue de respecter ses obligations légales de protection. Ces recommandations ne limitent ni votre droit de plainte ni vos recours.

## 9 Gérer vos renseignements personnels

Vous pouvez adresser une demande écrite au responsable de la protection des renseignements personnels pour savoir si nous détenons des renseignements vous concernant, y accéder ou en obtenir une copie. Vous pouvez aussi vous informer sur leur source, leurs fins, les catégories de personnel ayant accès et de destinataires, ainsi que leur durée de conservation. S'ils sont inexacts, incomplets ou équivoques, ou si leur collecte, communication ou conservation ne respecte pas la loi, vous pouvez demander leur rectification ou les autres mesures appropriées prévues par la loi.

Lorsque les conditions légales sont remplies, vous pouvez demander les renseignements personnels informatisés que nous avons recueillis auprès de vous dans un format technologique structuré et couramment utilisé, ou leur transmission à un destinataire que vous désignez et qui est légalement autorisé à les recueillir. Ce droit ne s'étend pas automatiquement aux renseignements que nous avons créés ou inférés et demeure soumis aux limites légales, notamment aux difficultés pratiques sérieuses. Les clauses de propriété intellectuelle de la Convention n'écartent pas vos droits légaux sur vos renseignements personnels.

Vous pouvez retirer votre consentement aux traitements facultatifs ou demander la suppression de renseignements devenus inutiles ou ne pouvant plus être légalement conservés. Si certains doivent encore être conservés, nous expliquerons le motif, la durée ou les critères permettant de l'établir, ainsi que les restrictions d'utilisation. Pour les renseignements déjà diffusés publiquement, vous pouvez aussi demander la cessation de leur diffusion, leur désindexation ou leur réindexation lorsque les conditions légales sont remplies.

Nous traitons les demandes d'accès ou de rectification dès que possible et répondons par écrit au plus tard 30 jours après leur réception. Au besoin, nous vous aidons à préciser la demande. Les autres demandes sont également traitées dans les délais prévus par les lois applicables. La vérification d'identité ou la transmission interne ne fait pas automatiquement repartir le délai légal. Si nous refusons tout ou partie d'une demande, nous expliquons les motifs, les dispositions légales applicables, les recours disponibles et leurs délais.

L'accès aux renseignements personnels est en principe gratuit. Si la loi permet des frais raisonnables de reproduction, de transcription ou de transmission, nous vous en indiquons le montant estimatif à l'avance. Présenter une demande relative à la confidentialité, refuser une utilisation facultative ou déposer une plainte légitime ne vous prive pas de l'accès aux fonctionnalités de base sans rapport avec cette question.

## 10 Plaintes et recours

Si vous estimez que nous avons traité des renseignements personnels contrairement à cette Politique ou à la loi, vous pouvez déposer une plainte à l'adresse courriel ou au point de contact du site indiqué au début du document. Veuillez préciser le compte concerné ou vos coordonnées, décrire le problème et indiquer la solution souhaitée. Le responsable de la protection des renseignements personnels examine la plainte, consigne le résultat et vous explique la décision et les mesures correctives. Toute partie concernant une demande d'accès ou de rectification demeure soumise au délai légal.

Vous pouvez également exercer les recours prévus par la loi auprès de la Commission d'accès à l'information du Québec (CAI). Pour les questions relevant de la LPRPDE, vous pouvez vous adresser au Commissariat à la protection de la vie privée du Canada (CPVP). Consultez les conditions de recevabilité, les procédures et les délais de l'autorité concernée. Notre procédure interne ne remplace pas ces recours et ne prolonge pas les délais légaux.

Ressources officielles : CAI droits et recours en matière de confidentialité; CPVP préoccupations et plaintes relatives à la vie privée.

## 11 Mises à jour et autres documents

Le traitement des renseignements personnels doit respecter les lois applicables, cette Politique et les avis fournis lors de la collecte. La licence d'évaluation de données d'essai non personnelles du paragraphe 7.3, l'autorisation distincte d'entraînement des modèles du paragraphe 7.4 et les clauses de confidentialité et de propriété intellectuelle de la Convention ne donnent aucune autorisation supplémentaire de traiter des renseignements personnels. Les sites tiers appliquent leur propre politique lorsqu'ils traitent des renseignements de manière indépendante. Pour les traitements que nous confions à des prestataires, leur politique ne remplace pas les responsabilités de la Société.

Nous publions cette Politique et les explications des modifications sur le site, en indiquant la version et la date de mise à jour, et fournissons un texte lisible et pouvant être conservé avant de recueillir les renseignements concernés. Si une modification touche les fins, le partage, les lieux de traitement ou d'autres droits ou intérêts importants, nous vous en informons de manière appropriée avant sa mise en œuvre et obtenons un nouveau consentement lorsque la loi l'exige. Une simple mise à jour du site, la poursuite de votre visite ou une absence de réponse à un avis ne remplace pas ce consentement.
'''
