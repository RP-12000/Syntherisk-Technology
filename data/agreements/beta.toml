## Article 4 Beta Version

4.1 The product is a beta version. The Company may adjust its features for testing, maintenance, security or resource needs. The beta service may experience interruptions, errors, inaccurate results or data loss. Unless the Parties expressly agree otherwise in writing, the Company does not guarantee continuous availability, a fixed response time or suitability for a particular purpose. This version does not provide audit functionality. The Participant must independently retain any materials required by law or applicable institutional requirements.

