Company personnel may access personal information only where their work requires it. For example, account administrators handle invitations and permissions, technical and support staff resolve operational issues, and the Privacy Officer handles requests and complaints. Personnel responsible for legal or security matters may also need information to address a specific dispute or incident. Each person's access is limited to their duties and is subject to confidentiality and purpose restrictions.

Service providers may support certain features, including website hosting, cloud infrastructure, databases, authentication and email, computing or model interfaces, technical support and security. We provide only the information needed for the work involved. Account and email services use necessary identity and contact information; computing or model interfaces process task content and necessary identifiers; and hosting and security services may process technical records. Providers unrelated to the features you use do not receive your information merely because they provide services to us.

Before entrusting information to a service provider, we set out requirements in a written contract covering purposes, confidentiality, security, subcontracting, retention, deletion, incident notification and verification, and restrict use for the provider's own purposes. We remain accountable for information under our control after entrusting its processing to a provider. Legal, accounting and other professional advisers receive information only where needed for a specific matter and permitted by law.

Disclosing personal information to other parties requires the appropriate consent or a reason expressly permitted or required by law, such as responding to valid legal process, meeting statutory reporting obligations or addressing an emergency covered by law. Where financing, a merger or a business transfer involves personal information, we disclose it only as legally permitted and necessary, with specific confidentiality and use restrictions. If a transaction does not proceed or the information is no longer needed, it must be returned or destroyed as required by law. After completion, notice is given as legally required.

## 6 Processing outside Québec

Service providers and their subcontractors may store, process or remotely access personal information outside Québec, including in other Canadian provinces or other countries. Information therefore may not remain exclusively in Québec or Canada. It may also be subject to the laws of the place where it is processed and to lawful requests from local governments or courts.

Before disclosing personal information outside Québec, or entrusting an organisation there with collecting, using, disclosing or retaining it, we complete the legally required privacy impact assessment, confirm that the information will receive adequate protection, and enter into a written agreement reflecting the assessment and risk mitigation measures. Required notice and consent procedures must also be completed first. We do not enable the processing until these conditions are met. You can contact the Privacy Officer for information about recipient categories, processing locations and safeguards relevant to your information.

## 7 Retention and deletion

We retain personal information only for as long as needed for the purposes we have explained. The periods below are the defaults for this beta. Information is deleted when they expire unless a legal requirement, preservation for a specific dispute or another lawful and necessary reason justifies keeping it longer. You may also request earlier deletion under Section 9. We will explain what can be deleted and what must still be retained by law.

Invitations and account information: We delete information for unactivated invitations within 30 days after the invitation expires. Ordinary account information is deleted within 30 days after you leave the beta or this beta round ends, whichever occurs first. Evidence of agreement acceptance is retained for the separate period below; it does not justify keeping the entire account or all tasks.

Task inputs and outputs: These are retained for no more than 30 days after task completion to deliver results and address related problems. Necessary technical records are retained for no more than 90 days. Support and complaint correspondence is normally kept for 12 months after the matter closes. Portions relating to statutory rights requests or requiring further preservation are kept for the legally required or specifically necessary period.

Acceptance and choice records: During your participation and for three years after it ends, we retain the minimum records needed to establish notices, agreement acceptance, authorisations and withdrawals. The three-year period applies only to this necessary evidence, not to all personal information. Information that is no longer needed is deleted sooner.

Legal requirements and special circumstances: Information used to make a decision about an individual is retained for at least one year after the decision. Information in the confidentiality incident register is kept for at least five years after the date or period when the Company became aware of the incident. If legal or regulatory requirements, or a specific dispute, require other material to be preserved, we retain only what is necessary, restrict other uses and dispose of it under this Policy once the reason for retention ends.

Deletion and backups: Once we confirm what can be deleted, information in live systems is normally removed within 30 days. Corresponding backup content is removed through backup rotation within a maximum of 90 days after deletion from live systems and is not used for ordinary business in the meantime. If a backup is restored, the relevant deletion restrictions are reapplied. Where the law requires earlier action, we comply. Technical deletion schedules do not extend statutory deadlines for responding to rights requests.

Eligible non-personal test data is handled under Section 3 and valid authorisations. Information that can still identify an individual remains subject to personal information retention periods, even if a name is replaced with a number, it is temporarily separated from an account or it is classified as research and development material. Information that does not meet the legal anonymisation standard cannot be treated as deleted or outside personal information protections.

## 8 Security and incident response

We use administrative, physical and technical safeguards appropriate to the sensitivity, purposes, quantity, distribution and storage of personal information, and restrict access and unnecessary copying. The Privacy Officer oversees retention, destruction, request handling and complaint procedures. Information systems and electronic service projects involving personal information undergo privacy impact assessments where required by law, with safeguards considered during design.

If a confidentiality incident occurs, or we have reasonable grounds to believe one has occurred, such as unauthorised access, use, disclosure or loss of personal information, we take reasonable steps to control the risk, investigate the cause and prevent recurrence, and document our response. Where there is a risk of serious injury, we promptly notify the regulator and affected individuals as required by Québec law. Where PIPEDA applies, we also meet its reporting, notification and record-keeping obligations. Notices include the facts, risks, response measures and contact details required by law.

Online services cannot eliminate every risk. Please protect your sign-in credentials, submit only material needed for testing that you are entitled to provide, and tell us promptly if you notice unusual activity. The Company remains responsible for its legal safeguards obligations, and these reminders do not limit your complaint or remedy rights.

## 9 Managing your personal information

You may send a written request to the Privacy Officer to confirm whether we hold personal information about you, access it or obtain a copy. You may also ask about its source, purposes, categories of personnel with access and recipients, and retention periods. If information is inaccurate, incomplete or equivocal, or was collected, disclosed or retained contrary to legal requirements, you may request correction or other appropriate measures in accordance with the law.

Where the legal conditions are met, you may request the computerised personal information we collected from you in a structured, commonly used technological format, or ask us to transfer it to a recipient you designate who is legally authorised to collect it. This right does not automatically extend to information we created or inferred and is subject to legal limits, including serious practical difficulties. The intellectual property provisions in the Beta Agreement do not exclude your statutory personal information rights.

You may withdraw consent to optional processing or request deletion of information that is no longer needed or may no longer lawfully be retained. If some information must still be kept by law, we will explain why, for how long or how that period is determined, and the limits on its use. For information already made public, you may also request that dissemination cease, or that information be de-indexed or re-indexed, where the legal conditions are met.

We handle access and correction requests as soon as possible and respond in writing no later than 30 days after receiving the request. Where needed, we help you clarify it. Other requests are also handled promptly under applicable law. Identity verification or internal forwarding does not automatically restart the statutory deadline. If we cannot grant all or part of a request, we explain the reasons, the applicable legal provisions, and the available remedies and time limits.

Access to personal information is generally free. If the law permits reasonable reproduction, transcription or transmission charges, we tell you the estimated amount in advance. Making a privacy request, refusing an optional use or lawfully complaining does not remove eligibility for basic beta features unrelated to the matter.

## 10 Complaints and regulatory remedies

If you believe we have handled personal information contrary to this Policy or the law, you can complain using the email address or website contact option at the beginning of this document. Please identify the relevant account or provide contact details, explain the issue and tell us how you would like it resolved. The Privacy Officer investigates, records the outcome and explains the decision and any corrective action. Any part involving an access or correction request remains subject to the statutory deadline.

You may also seek a remedy from the Commission d'accès à l'information du Québec (CAI) as provided by law. For matters within PIPEDA's scope, you may contact the Office of the Privacy Commissioner of Canada (OPC). Please check the relevant authority's eligibility requirements, procedures and deadlines. Our internal process neither replaces regulatory remedies nor extends statutory time limits.

Official resources: CAI privacy rights and remedies; OPC privacy concerns and complaints.

## 11 Policy updates and related documents

Personal information must be handled in accordance with applicable law, this Policy and the notices given at collection. The licence to evaluate non-personal test data in Clause 7.3 of the Beta Agreement, the separate model training authorisation in Clause 7.4, and the Agreement's confidentiality and intellectual property provisions do not provide additional authorisation to process personal information. Third-party websites apply their own privacy policies when processing information independently. For processing we entrust to service providers, a provider's policy does not replace the Company's responsibilities.

We publish this Policy and explanations of revisions on the website, identify the version and update date, and provide a readable, savable text before collecting the relevant information. If a revision affects purposes, sharing, processing locations or other important rights or interests, we give appropriate notice before implementation and obtain fresh consent where required by law. Updating a webpage, your continued use or your failure to respond to a notice cannot replace new consent required by law.
