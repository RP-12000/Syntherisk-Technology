## Article 1 Parties and Agreement Documents

1.1 This Agreement is entered into between Syntherisk Technology Inc., located in Québec, Canada (the "Company"), and the individual invited by the Company who becomes eligible to participate in the beta under this Agreement (the "Participant"). Each is a "Party" and together they are the "Parties".

