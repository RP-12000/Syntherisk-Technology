2.4 L'acceptation doit être enregistrée avec succès dans un stockage sous le contrôle de la Société et son intégralité vérifiée avant l'activation de l'accès. La conservation de l'état des cases uniquement dans le navigateur ou l'affichage d'un message de succès ne satisfait pas à cette exigence. L'entraînement facultatif ne peut être activé que si l'autorisation correspondante est valablement enregistrée; son retrait doit également empêcher les utilisations ultérieures à cette fin. La Société doit pouvoir fournir au Participant sa preuve d'acceptation et le texte correspondant, et conserver les éléments nécessaires relatifs aux corrections, retraits et changements de version. La valeur probante des documents électroniques dépend du droit applicable, et non de la décision unilatérale d'une Partie.

## Article 3 Licence d'essai et utilisations permises

3.1 Cet essai est gratuit. La participation commence après une acceptation juridiquement valide et l'activation de l'accès; elle prend fin au retrait du Participant, à la cessation de son droit de participation ou à la fin de cet essai. La Société accorde au Participant une licence d'utilisation limitée, non exclusive, incessible et ne permettant pas l'octroi de sous-licences, uniquement pour évaluer personnellement les fonctionnalités mises à disposition par la Société et effectuer des recherches et des évaluations à des fins non commerciales. Le produit ne doit pas servir de service de production ni permettre de fournir des services payants à des tiers.

3.2 Cet essai n'exige aucun téléversement de fichiers, mais les fonctionnalités disponibles permettent de saisir des structures moléculaires, des chaînes SMILES ou d'autres textes. Les données saisies doivent se limiter à des contenus publics et non sensibles que le Participant est légalement en droit de fournir. La présence d'un champ de saisie n'autorise pas la transmission de recherches non publiées ou de documents soumis à des restrictions. La Société peut fixer des limites d'utilisation raisonnables selon les ressources disponibles et doit les communiquer avant l'utilisation. La gratuité de cet essai ne constitue pas un engagement à offrir gratuitement les services futurs. Toute facturation ou reconduction automatique nécessite une entente expresse distincte et une acceptation valide.

3.3 Le Participant ne doit pas prêter, revendre ou partager un compte ou des identifiants d'accès, permettre un accès non autorisé à des tiers, contourner des autorisations ou des limites de requêtes, accéder aux contenus d'autres utilisateurs, effectuer des essais destructifs ou perturber le service. Sans l'autorisation écrite préalable de la Société, il ne doit pas obtenir systématiquement des résultats, reconstituer des bases de données, recueillir des données d'entraînement ou contourner les limites de l'essai au moyen de scripts, de robots d'exploration, de requêtes en masse, de comptes multiples ou d'autres procédés. Toute perte de contrôle d'un compte ou tout accès non autorisé constaté doit être signalé rapidement à la Société.

3.4 Sauf pour les actes que le droit applicable ne permet pas de restreindre ou que la Société a préalablement autorisés par écrit, le Participant ne doit pas décompiler, désassembler, procéder à une rétro-ingénierie, extraire ou distiller des modèles, ni obtenir du code source, des poids, paramètres, instructions système, règles de notation ou méthodes de mise en œuvre non publics par sondage systématique, injection d'instructions ou tout autre moyen. Il ne doit pas utiliser les Renseignements confidentiels de la Société, les contenus protégés du produit ou les résultats obtenus en vertu des licences de la Convention pour entraîner, ajuster, calibrer ou créer des modèles, jeux de données ou services destinés à remplacer, reproduire ou concurrencer les produits de la Société. Le présent paragraphe ne limite pas le développement indépendant sans utilisation de ces éléments restreints, les recherches qui ne peuvent être légalement interdites ni les autres exceptions prévues par la loi.

## Article 4 Version d'essai

4.1 Le produit est une version bêta. La Société peut ajuster ses fonctionnalités pour les besoins des essais, de la maintenance, de la sécurité ou des ressources disponibles. Le service d'essai peut connaître des interruptions, des erreurs, des résultats inexacts ou des pertes de données. Sauf entente écrite expresse contraire entre les Parties, la Société ne garantit ni une disponibilité continue, ni un délai de réponse fixe, ni l'adéquation à un usage particulier. La version actuelle ne comporte aucune fonction d'audit. Le Participant doit conserver lui-même les documents dont la conservation lui est imposée par la loi ou les règles qui lui sont applicables.

4.2 Les résultats du produit sont destinés uniquement à la recherche et à l'évaluation. Avant tout approvisionnement, expérimentation, synthèse, changement d'échelle, publication ou autre application pratique, le Participant doit vérifier de manière indépendante les sources originales, la situation des droits de propriété intellectuelle, la réglementation applicable et les conditions de sécurité, et suivre les procédures d'approbation de son établissement. La Société ne garantit pas que les voies de synthèse générées sont réalisables, que les résultats expérimentaux sont reproductibles ou que les résultats du produit suffisent à établir la sécurité, la conformité ou l'absence d'atteinte aux droits de tiers.

4.3 La description des capacités du produit figurant au présent article ne libère pas la Société de ses obligations légales ou contractuelles de confidentialité, de protection des renseignements personnels, de gestion des incidents, ni de toute autre responsabilité qui ne peut être légalement exclue.

## Article 5 Définition des renseignements confidentiels et exceptions

5.1 Les « Renseignements confidentiels » sont les renseignements non publics qu'une Partie ou son représentant autorisé divulgue, fournit ou rend accessibles à l'autre Partie dans le cadre de cet essai, et qui sont désignés comme confidentiels ou doivent raisonnablement être considérés comme tels compte tenu de leur nature et des circonstances de leur divulgation. La Partie qui fournit les renseignements est la « Partie divulgatrice »; celle qui les reçoit est la « Partie destinataire ». Le support de l'information ne détermine pas à lui seul son caractère confidentiel, pas plus que la présence ou l'absence d'une mention de confidentialité.

5.2 Les Renseignements confidentiels de la Société comprennent les interfaces, fonctionnalités, défauts, performances, résultats d'essais, code source, architecture, documentation technique, poids et paramètres des modèles, mises en œuvre d'algorithmes, instructions système, méthodes de recherche et de classement, règles de notation et de calibration, sélection et organisation des jeux de données non publics, configurations, plans de développement, plans d'affaires, tarifs et renseignements sur les clients qui ne sont pas publics. Ils comprennent aussi les captures d'écran, enregistrements, copies, fichiers exportés et rapports comparatifs qui divulguent, déduisent ou reproduisent ces renseignements. Le caractère public d'éléments individuels ne fait pas automatiquement perdre leur confidentialité à une combinaison, une mise en œuvre ou des relations qui demeurent non publiques; les exceptions du paragraphe 5.4 restent applicables.

5.3 Les commentaires non publics, communications de soutien et autres renseignements que le Participant est légalement en droit de divulguer et fournit dans le cadre autorisé constituent également ses Renseignements confidentiels s'ils satisfont au paragraphe 5.1. L'absence d'obligation de téléverser des documents ne retire pas la protection des renseignements fournis volontairement qui doivent raisonnablement demeurer confidentiels. Cette protection ne signifie toutefois pas que la Société accepte de recevoir des contenus dépassant le cadre des articles 3 et 7.

5.4 Les obligations de confidentialité ne s'appliquent pas aux renseignements pour lesquels la Partie destinataire peut établir, au moyen de preuves raisonnables, qu'ils sont devenus publics sans manquement de sa part; qu'elle les détenait légalement avant leur divulgation, sans obligation de confidentialité; qu'elle les a légalement obtenus d'un tiers autorisé à les divulguer sans violer une obligation de confidentialité; qu'elle les a développés de manière indépendante sans utiliser les Renseignements confidentiels de la Partie divulgatrice; ou que leur divulgation publique a été autorisée par écrit par la Partie divulgatrice.

## Article 6 Obligations de confidentialité et divulgations permises

6.1 La Partie destinataire ne peut utiliser les Renseignements confidentiels que pour exécuter la Convention et réaliser les essais autorisés. Elle doit prendre des mesures de protection adaptées à la nature des renseignements et aux risques associés, en faisant preuve au minimum d'une diligence raisonnable. Sans le consentement écrit préalable de la Partie divulgatrice, elle ne doit pas utiliser, divulguer, vendre ou concéder sous licence les Renseignements confidentiels à d'autres fins commerciales pour son propre compte ou dans l'intérêt d'un tiers.

6.2 La Partie destinataire ne peut divulguer les Renseignements confidentiels qu'aux personnes autorisées qui ont réellement besoin d'en prendre connaissance pour accomplir les fins susmentionnées et qui sont assujetties à des obligations de confidentialité suffisantes en vertu de la loi ou d'un contrat. Elle doit encadrer l'accès et l'utilisation par les personnes qu'elle autorise et répondre de leurs actes dans la mesure prévue par la loi. Le recours de la Société à des prestataires de services doit également respecter l'article 9 et l'avis relatif au traitement des renseignements personnels.

6.3 Sans l'autorisation écrite préalable de la Partie divulgatrice, les Renseignements confidentiels ne doivent pas être divulgués sur les médias sociaux, dans des groupes publics ou non approuvés, des dépôts de code, des publications scientifiques, des cours, des conférences, des présentations à des clients ou des activités de marketing. Ils ne doivent pas être téléversés vers des services tiers d'intelligence artificielle, de traduction ou de traitement de fichiers non approuvés. Le retrait des noms ou identifiants ne fait pas automatiquement perdre leur caractère confidentiel aux structures, voies de synthèse ou renseignements techniques qui demeurent identifiables.

6.4 Lorsqu'une divulgation est imposée par une ordonnance judiciaire, une loi ou une autorité compétente, la Partie destinataire doit en aviser préalablement la Partie divulgatrice dans la mesure où la loi le permet et où cela est possible en pratique, et limiter la divulgation à ce qui est légalement nécessaire. La Convention ne doit pas restreindre indûment la divulgation à un conseiller juridique tenu au secret professionnel et ayant réellement besoin d'en prendre connaissance, ni les plaintes, signalements ou communications aux autorités de surveillance protégés par la loi, ni les divulgations légalement permises pour la santé et la sécurité publiques. Le présent paragraphe n'autorise aucune diffusion publique dépassant la protection accordée par le droit applicable.

6.5 Dès qu'elle constate un accès, une utilisation ou une divulgation non autorisés de Renseignements confidentiels, la Partie destinataire doit en aviser la Partie divulgatrice sans retard injustifié et prendre des mesures raisonnables pour faire cesser l'atteinte, en limiter les effets et collaborer aux mesures correctives. Aucune Partie ne peut, à cette occasion, détruire des preuves dont la conservation est légalement requise ni entraver les enquêtes ou obligations de notification prévues par la loi.

6.6 Sans le consentement écrit de l'autre Partie, aucune Partie ne peut utiliser le nom, les marques de commerce ou les logos de l'autre Partie, le fait de sa participation à l'essai ou des résultats d'essais non publics à des fins de publicité, de recommandation ou de présentation d'études de cas.

## Article 7 Contenus utilisateur et autorisation limitée de traitement

7.1 Les « Contenus utilisateur » comprennent les structures moléculaires, chaînes SMILES et autres textes saisis par le Participant dans le produit, ainsi que les contenus fournis par les canaux autorisés de rétroaction ou de soutien. La saisie, le collage ou toute autre forme d'entrée constitue une transmission, avec ou sans téléversement de fichier. Le Participant doit avoir le droit de fournir ces contenus et d'accorder les licences du présent article, ne pas porter atteinte aux droits de tiers et ne pas inclure de renseignements personnels inutiles à cet essai. L'accessibilité publique ne signifie pas automatiquement l'absence de restrictions relatives au droit d'auteur, aux brevets ou à d'autres utilisations.

7.2 Pour fournir cet essai, le Participant accorde à la Société, sur les Contenus utilisateur qu'il a le droit de concéder sous licence, une licence de traitement non exclusive et sans redevances, limitée à ce qui est nécessaire à l'exécution de la Convention. Elle couvre la réception, la reproduction, le stockage, les opérations informatiques et la transmission des contenus, la génération et la remise des résultats, ainsi que le soutien technique, le maintien de la sécurité et le dépannage directement liés à l'essai. La Société ne peut accorder les permissions de traitement nécessaires qu'aux prestataires dont la participation est nécessaire à ces fins et qui sont soumis aux restrictions correspondantes de finalité et de confidentialité, conformément aux exigences d'information et de protection de l'article 9. Cette licence ne transfère pas la propriété des Contenus utilisateur, n'autorise ni la publication ou la vente des contenus bruts ni leur utilisation par les prestataires à leurs propres fins, et ne remplace pas les consentements légalement requis concernant les renseignements personnels. Après la fin du service, le traitement ne peut se poursuivre que pour la disposition légale des contenus, la préservation d'éléments en cas de différend ou d'autres obligations nécessaires qui subsistent. La conservation et la suppression sont régies par les articles 9 et 10. L'évaluation du produit, la calibration et l'entraînement des modèles relèvent respectivement des paragraphes 7.3 et 7.4, sans autorisation supplémentaire découlant du présent paragraphe.

7.3 Le Participant permet à la Société d'utiliser les parties des données saisies publiques et non sensibles et des résultats correspondants qu'il a le droit de concéder sous licence, qui ne contiennent ni renseignements personnels ni Renseignements confidentiels du Participant ou d'un tiers, et qui ne sont pas soumises à des restrictions de finalité imposées par des tiers, ainsi que les étiquettes d'erreur et notes de qualité satisfaisant à ces conditions, pour l'évaluation interne de l'exactitude, les tests de régression, l'analyse des défauts et la calibration des échelles et seuils de notation des produits Syntherisk. Ces éléments constituent les « Données d'essai admissibles ». Cette autorisation non exclusive et sans redevances est limitée à ces fins d'amélioration pendant la Convention et durant les trois années suivant sa fin. L'entraînement ou l'ajustement de modèles d'apprentissage automatique nécessite une autorisation distincte au titre du paragraphe 7.4. La Société doit vérifier les sources et droits d'utilisation et exclure les contenus inadmissibles avant l'évaluation. Les comptes, adresses courriel, adresses IP, historiques de tâches associables à une personne et données simplement dépersonnalisées ne deviennent pas de ce seul fait des Données d'essai admissibles.

7.4 L'entraînement ou l'ajustement des modèles n'est permis qu'après une autorisation facultative, expresse et vérifiable donnée séparément par le Participant, et uniquement pour les Données d'essai admissibles qu'il a le droit de concéder sous licence. Ni l'acceptation de la Convention ni le choix linguistique de la fenêtre actuelle n'autorise cet entraînement. Avant de recueillir l'autorisation, la Société doit fournir un Avis sur l'entraînement des modèles distinct précisant les données concernées, les fins et méthodes d'entraînement, les prestataires participants, les lieux de traitement, les durées de conservation, les moyens de retrait, le traitement des modèles existants et les risques résiduels, et conserver la version correspondante. L'autorisation doit être recueillie par une interface distincte ou un autre moyen écrit explicite; toute case doit être décochée par défaut. Le refus ou le retrait de cette autorisation n'affecte pas l'utilisation des fonctionnalités de base de l'essai conformément à la Convention. Aucun entraînement ne peut commencer avant la mise en place de l'avis, des preuves d'autorisation et des mécanismes de retrait. L'autorisation est non exclusive et sans redevances, uniquement pour développer et commercialiser les produits Syntherisk; elle n'autorise ni l'entraînement par les prestataires pour eux-mêmes ou d'autres clients ni la publication ou la revente des contenus bruts. Le Participant peut la retirer par le canal pertinent publié sur le site de la Société. Celle-ci doit cesser d'utiliser les données concernées pour les entraînements ultérieurs; le traitement des modèles existants suit les modalités clairement communiquées à l'avance et juridiquement valides. Les renseignements personnels ne peuvent être intégrés à l'entraînement au titre de cette autorisation; toute entente spécifique distincte et juridiquement valide régit son propre champ d'application.

