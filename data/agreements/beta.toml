2.3 Contracting through a representative or obtaining guardian consent does not replace legally required privacy notices and consent. Where minors' personal information is involved, the Company must complete the applicable special protection procedures before the relevant processing. Capacity to consent to personal information processing and capacity to enter into a contract must be assessed separately; a single presumed age threshold does not apply to both. A guardian does not automatically assume liability as a guarantor or waive the minor's statutory rights merely by applying, contracting as a representative or giving consent.

