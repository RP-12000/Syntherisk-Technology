8.1 Les « Technologies de la Société » comprennent les produits, codes source et objet, architectures, modèles et leurs poids et paramètres, mises en œuvre d'algorithmes, instructions système, méthodes de recherche et de classement, systèmes de notation et de calibration, interfaces logicielles, documentation, agencements de jeux de données non publics, marques de commerce, secrets commerciaux et améliorations connexes que la Société développe ou sur lesquels elle acquiert légalement des droits. La Société et ses concédants conservent tous les droits qu'ils détiennent respectivement. Le Participant n'obtient que les licences limitées expressément prévues à l'article 3 et au présent article. Une invitation, un accès, un paiement, une rétroaction ou une participation à l'évaluation ne lui confère aucun droit de propriété, de copropriété, d'exclusivité, de partage de revenus ni aucune licence implicite sur les Technologies de la Société.

